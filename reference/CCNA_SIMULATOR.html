<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CCNA_SRWE_SIMULATOR</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F1117;--bg2:#1A1D27;--bg3:#22263A;
  --border:#2E3348;--border2:#3A3F5C;
  --text:#E8EAF6;--text2:#9BA3C4;--text3:#6B7399;
  --green:#1D9E75;--green-bg:#0D3D2E;--green-text:#5EE0A8;
  --red:#A32D2D;--red-bg:#3D0D0D;--red-text:#F08080;
  --blue:#185FA5;--blue-bg:#0D2A4A;--blue-text:#7AB8F5;
  --yellow:#BA7517;--yellow-bg:#3D2A06;--yellow-text:#F5C842;
  --purple:#534AB7;--purple-bg:#1E1A3D;--purple-text:#A89DF5;
  --radius:10px;--radius-sm:6px;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'Courier New',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:0}
#app{max-width:680px;margin:0 auto;padding:16px}
.hud-topbar{display:flex;align-items:center;justify-content:flex-end;margin-bottom:6px;gap:6px}
.hud{display:flex;gap:6px;flex-wrap:nowrap;margin-bottom:6px;align-items:center;width:100%}
.hud-bar2{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px}
.hc{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:6px 11px;font-size:12px;display:flex;align-items:center;gap:6px}
.hc-v{font-weight:600;font-size:13px;color:var(--text)}
.hc-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.pbar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:14px}
.pfill{height:100%;border-radius:2px;background:var(--green);transition:width .4s}
.qcard{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.qtag{display:inline-block;font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.qnum{font-size:11px;color:var(--text3);margin-bottom:5px}
.qtext{font-size:14px;color:var(--text);line-height:1.7}
.qcode{background:var(--bg3);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--mono);font-size:11px;margin-top:10px;white-space:pre;overflow-x:auto;color:#A8D8A8;line-height:1.55}
.qfig{background:var(--bg3);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;margin-top:10px;overflow:hidden}
.opts{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.opt{background:var(--bg2);border:.5px solid var(--border2);border-radius:var(--radius-sm);padding:11px 14px;text-align:left;cursor:pointer;font-size:13px;color:var(--text);display:flex;align-items:flex-start;gap:10px;transition:background .12s,border-color .12s;width:100%}
.opt:hover:not(:disabled){background:var(--bg3);border-color:#5A6080}
.opt:disabled{cursor:default}
.olet{font-weight:700;font-size:11px;min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;border:.5px solid var(--border2);color:var(--text2)}
.opt.correct{background:var(--green-bg)!important;border-color:var(--green)!important}
.opt.correct .olet{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{background:var(--red-bg)!important;border-color:var(--red)!important}
.opt.wrong .olet{background:var(--red);color:#fff;border-color:var(--red)}
.opt.dim{opacity:.3}
.opt.sel{background:var(--blue-bg)!important;border-color:var(--blue)!important}
.opt.sel .olet{background:var(--blue);color:#fff;border-color:var(--blue)}
.multi-note{font-size:11px;color:var(--text3);margin-bottom:8px;font-style:italic}
.mc-wrap{position:relative;margin-bottom:8px;user-select:none}
.mc-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.mc-left-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:9px 10px;margin-bottom:7px;min-height:46px;gap:8px;cursor:default}
.mc-right-item{display:flex;align-items:center;gap:9px;background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:9px 10px;margin-bottom:7px;min-height:46px}
.mc-ltext{font-size:12px;flex:1;line-height:1.4}
.mc-rtext{font-size:12px;flex:1;line-height:1.4}
.mc-ldot{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border2);background:transparent;cursor:pointer;flex-shrink:0;transition:all .18s;box-sizing:border-box}
.mc-ldot:hover{opacity:.8;border-color:#ccc}
.mc-ldot.mc-pend{box-shadow:0 0 0 4px rgba(255,255,255,.25);border-color:#fff!important;background:rgba(255,255,255,.15)!important}
.mc-rdot{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--border2);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);transition:all .18s;box-sizing:border-box}
.mc-rdot:hover:not(.mc-disabled){opacity:.8}
.mc-rdot.mc-disabled{cursor:default}
.fb{border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:10px;border:.5px solid;font-size:13px;line-height:1.65}
.fb.ok{background:var(--green-bg);border-color:var(--green);color:var(--green-text)}
.fb.ng{background:var(--red-bg);border-color:var(--red);color:var(--red-text)}
.fb.part{background:var(--yellow-bg);border-color:var(--yellow);color:var(--yellow-text)}
.fb-title{font-weight:600;margin-bottom:3px}
.ai-box{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:10px}
.ai-head{font-size:11px;color:var(--text3);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.ai-label{font-weight:600;color:var(--text2)}
.ai-text{font-size:13px;color:var(--text);line-height:1.75}
.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.btn{background:var(--bg2);border:.5px solid var(--border2);border-radius:var(--radius-sm);padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text);transition:background .12s;font-family:var(--font)}
.btn:hover{background:var(--bg3)}
.btn.pri{background:var(--green);color:#fff;border-color:var(--green)}
.btn.pri:hover{background:#15795A}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.blue:hover{background:#0E4A82}
.xp-b{background:var(--yellow-bg);color:var(--yellow-text);border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;border:.5px solid var(--yellow)}
.str-b{background:var(--purple-bg);color:var(--purple-text);border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;border:.5px solid var(--purple)}
.hearts{display:flex;gap:3px;font-size:16px}
.h-lost{opacity:.2}
.lv-bar{width:60px;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.lv-fill{height:100%;background:var(--green);transition:width .5s}
.start-wrap{padding:8px 0}
.start-h{font-size:24px;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.3}
.start-sub{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:14px}
.tpill{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;font-size:11px;color:var(--text2);display:flex;align-items:center;gap:6px}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.info-box{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;font-size:12px;color:var(--text2);line-height:1.9}
.res-wrap{text-align:center;padding:20px 8px}
.big-s{font-size:60px;font-weight:700;color:var(--text);line-height:1}
.res-sub{font-size:13px;color:var(--text2);margin:8px 0 16px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat-c{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.stat-v{font-size:22px;font-weight:700;color:var(--text)}
.stat-l{font-size:10px;color:var(--text3);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.badge-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.badge{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;border:.5px solid}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.offline-note{background:var(--yellow-bg);border:.5px solid var(--yellow);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--yellow-text);line-height:1.65}
/* ── CERTIFICADO ── */
.cert-wrap{position:relative;background:linear-gradient(145deg,#12172B,#1A1D2F,#12172B);border:2px solid;border-radius:16px;padding:28px 24px 22px;margin:0 auto;max-width:480px;text-align:center;animation:certIn .7s cubic-bezier(.22,1,.36,1) both}
@keyframes certIn{from{opacity:0;transform:scale(.88) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
.cert-top-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
.cert-icon{font-size:48px;line-height:1;margin-bottom:6px;animation:iconPop .5s .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes iconPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.cert-title-sm{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.cert-rank{font-size:26px;font-weight:800;letter-spacing:.01em;margin-bottom:6px;animation:rankGlow 2.5s 1s ease-in-out infinite alternate}
@keyframes rankGlow{from{filter:brightness(1)}to{filter:brightness(1.25)}}
.cert-sub{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:14px}
.cert-divider{border-top:1px solid;margin:12px 0}
.cert-score-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}
.cert-stat{flex:1;text-align:center}
.cert-stat-v{font-size:24px;font-weight:800;line-height:1}
.cert-stat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.cert-seal{width:82px;height:82px;border-radius:50%;border:2.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;animation:sealSpin .8s .6s cubic-bezier(.34,1.56,.64,1) both;padding:6px}
@keyframes sealSpin{from{opacity:0;transform:scale(0) rotate(-180deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.cert-stats-mini{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:11px;color:var(--text2);margin-top:6px}
.cert-corner{position:absolute;width:18px;height:18px;border-style:solid;border-width:0}
.cert-corner.tl{top:10px;left:10px;border-top-width:2px;border-left-width:2px;border-radius:4px 0 0 0}
.cert-corner.tr{top:10px;right:10px;border-top-width:2px;border-right-width:2px;border-radius:0 4px 0 0}
.cert-corner.bl{bottom:10px;left:10px;border-bottom-width:2px;border-left-width:2px;border-radius:0 0 0 4px}
.cert-corner.br{bottom:10px;right:10px;border-bottom-width:2px;border-right-width:2px;border-radius:0 0 4px 0}
.info-btn{width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1.5px solid var(--border2);color:var(--text2);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;font-family:var(--font);flex-shrink:0}
.info-btn:hover{background:var(--bg3);border-color:#5A6080;color:var(--text)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:20px 22px;max-width:420px;width:100%;position:relative}
.modal-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:4px}
.modal-close:hover{color:var(--text);background:var(--bg3)}
.modal-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:.5px solid var(--border)}
.modal-row:last-child{border-bottom:none}
.modal-icon{font-size:16px;min-width:22px;text-align:center;margin-top:1px}
.modal-text{font-size:12px;color:var(--text2);line-height:1.7}
.modal-text strong{color:var(--text)}
.err-badge{display:inline-block;background:var(--red-bg);color:var(--red-text);border:.5px solid var(--red);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
/* ── TOOLTIPS DE SIGLAS ── */
.acr{border-bottom:1.5px dotted var(--blue);color:inherit;cursor:help;position:relative;white-space:nowrap;transition:color .12s}
.acr:hover{color:var(--blue-text)}
.acr::after{content:attr(data-def);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#1A2540;color:#E8F0FF;border:1px solid #334477;border-radius:8px;padding:7px 12px;font-size:11.5px;font-weight:500;max-width:min(260px,80vw);white-space:normal;line-height:1.5;z-index:999;pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 4px 16px rgba(0,0,0,.45);text-align:left;min-width:140px}
.acr::before{content:'';position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#334477;opacity:0;transition:opacity .15s;z-index:1000;pointer-events:none}
.acr:hover::after,.acr:hover::before,.acr.tip-open::after,.acr.tip-open::before{opacity:0!important}
[data-theme="light"] .acr::after{background:#1E2D5A;color:#EEF2FF;border-color:#3B5499;box-shadow:0 4px 16px rgba(0,0,60,.3)}
[data-theme="light"] .acr::before{border-top-color:#3B5499}
.acr-hint{font-size:10px;color:var(--text3);margin-bottom:6px;text-align:center;font-style:italic}
/* ── MODO CLARO ── */
[data-theme="light"]{--bg:#F0F2FF;--bg2:#FFFFFF;--bg3:#E8EBFF;--border:#CDD2F0;--border2:#B0B8E0;--text:#111827;--text2:#374151;--text3:#6B7280;--green-bg:#DCFCE7;--green-text:#166534;--red-bg:#FEE2E2;--red-text:#991B1B;--blue-bg:#DBEAFE;--blue-text:#1E40AF;--yellow-bg:#FEF3C7;--yellow-text:#92400E;--purple-bg:#EDE9FE;--purple-text:#5B21B6}
[data-theme="light"] body{background:#F0F2FF}
[data-theme="light"] .qcode{color:#1A5C3A;background:#E8F5EE}
[data-theme="light"] .cert-wrap{background:linear-gradient(145deg,#E8EBFF,#F5F7FF,#E8EBFF)}
/* ── BOTÃO TEMA ── */
.theme-btn{width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1.5px solid var(--border2);color:var(--text2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s;font-family:var(--font);padding:0;flex-shrink:0}
.theme-btn:hover{background:var(--bg3)}
/* ── TIMER ── */
.timer-ok{background:var(--green-bg);color:var(--green-text);border:.5px solid var(--green);border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
.timer-warn{background:var(--yellow-bg);color:var(--yellow-text);border:.5px solid var(--yellow);border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
.timer-danger{background:var(--red-bg);color:var(--red-text);border:.5px solid var(--red);border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;animation:tpulse .7s infinite}
@keyframes tpulse{0%,100%{opacity:1}50%{opacity:.45}}
/* ── FAVORITOS ── */
.fav-btn{background:none;border:none;cursor:pointer;font-size:17px;padding:2px 5px;line-height:1;opacity:.3;transition:opacity .15s,transform .2s;color:var(--yellow);flex-shrink:0}
.fav-btn:hover{opacity:.7}
.fav-btn.fav-on{opacity:1;animation:favPop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes favPop{0%{transform:scale(.4)}100%{transform:scale(1)}}
/* ── ESTATÍSTICAS POR TEMA ── */
.topic-stats-wrap{margin:14px 0 0}
.topic-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.topic-name{font-size:10px;color:var(--text2);width:90px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-bar-wrap{flex:1;height:11px;background:var(--bg3);border-radius:6px;overflow:hidden}
.topic-bar-fill{height:100%;border-radius:6px;transition:width .8s ease}
.topic-pct{font-size:10px;color:var(--text2);min-width:28px;text-align:right;font-weight:600}
/* ── HISTÓRICO ── */
.hist-wrap{padding:4px 0}
.hist-list{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}
.hist-item{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;display:flex;align-items:center;gap:12px}
.hist-pct{font-size:22px;font-weight:700;min-width:46px;text-align:center}
.hist-info{flex:1}
.hist-date{font-size:10px;color:var(--text3);margin-bottom:2px}
.hist-detail{font-size:11px;color:var(--text2)}
.hist-tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;border:.5px solid;white-space:nowrap}
/* ── REVISÃO ── */
.review-nav{display:flex;align-items:center;justify-content:space-between;padding:6px 0 12px}
.review-ctr{font-size:13px;color:var(--text2);font-weight:500;background:var(--bg2);border:.5px solid var(--border);border-radius:20px;padding:4px 12px}
/* ── SELEÇÃO DE MODO ── */
.mode-row{display:flex;gap:8px;margin-bottom:14px}
.mode-card{flex:1;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:11px 8px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;-webkit-user-select:none;user-select:none}
.mode-card:hover{background:var(--bg3)}
.mode-card.sel-mode{border-color:var(--green);background:var(--green-bg)}
.mode-icon{font-size:20px;margin-bottom:4px}
.mode-title{font-size:12px;font-weight:700;color:var(--text)}
.mode-sub{font-size:10px;color:var(--text3);margin-top:2px}
/* ── COUNTDOWN ── */
.countdown-box{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.cd-unit{text-align:center;min-width:38px}
.cd-num{font-size:22px;font-weight:700;color:var(--text);line-height:1}
.cd-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.cd-sep{font-size:20px;font-weight:700;color:var(--text3);margin-bottom:12px}
/* ── STATS POR QUESTÃO ── */
.qstat-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:.5px solid var(--border)}
.qstat-row:last-child{border-bottom:none}
.qstat-id{font-size:10px;color:var(--text3);min-width:28px}
.qstat-text{font-size:12px;color:var(--text2);flex:1;line-height:1.4}
.qstat-bar{width:50px;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;flex-shrink:0}
.qstat-fill{height:100%;border-radius:3px}
.qstat-pct{font-size:10px;font-weight:600;min-width:28px;text-align:right}
/* ── LEADERBOARD ── */
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:.5px solid var(--border);border-radius:0}
.lb-row:last-child{border-bottom:none}
.lb-pos{font-size:14px;font-weight:700;min-width:26px;text-align:center}
.lb-name{flex:1;font-size:13px;font-weight:600;color:var(--text)}
.lb-pct{font-size:13px;font-weight:700}
.lb-detail{font-size:10px;color:var(--text3);margin-top:1px}
/* ── CERT NAME ── */
.cert-student-name{font-size:16px;font-weight:700;color:var(--text);letter-spacing:.02em;margin-bottom:4px}
/* ── SEÇÃO HEADER ── */
.sec-hdr{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
/* ── ANIMAÇÃO ACERTO/ERRO ── */
@keyframes flashOk{0%{box-shadow:inset 0 0 0 3px #1D9E75}50%{box-shadow:inset 0 0 0 3px #1D9E7588}100%{box-shadow:none}}
@keyframes flashNg{0%{box-shadow:inset 0 0 0 3px #A32D2D}50%{box-shadow:inset 0 0 0 3px #A32D2D88}100%{box-shadow:none}}
.flash-ok{animation:flashOk .5s ease-out}
.flash-ng{animation:flashNg .5s ease-out}
/* ── BUSCA ── */
.search-box{background:var(--bg2);border:.5px solid var(--border2);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;color:var(--text);width:100%;font-family:var(--font);outline:none;margin-bottom:10px}
.search-box:focus{border-color:#5A6080}
.search-item{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:6px;cursor:pointer;transition:background .12s}
.search-item:hover{background:var(--bg3)}
.search-num{font-size:10px;color:var(--text3);margin-bottom:3px}
.search-text{font-size:13px;color:var(--text);line-height:1.5}
.search-tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 8px;border-radius:20px;margin-top:4px}
/* ── TIMER QUESTÃO ── */
.qtimer{font-size:11px;color:var(--text3);font-weight:500;padding:2px 8px;background:var(--bg3);border-radius:20px;border:.5px solid var(--border)}
/* ── EVOLUÇÃO ── */
.evo-bar-wrap{height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;flex:1}
.evo-bar-fill{height:100%;border-radius:5px;transition:width .6s ease}
.evo-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.evo-label{font-size:10px;color:var(--text2);width:88px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evo-pct{font-size:10px;font-weight:600;min-width:30px;text-align:right}
/* ── MODO TÓPICO ── */
.topic-sel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.topic-chip{background:var(--bg2);border:.5px solid var(--border2);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;transition:background .12s,border-color .12s}
.topic-chip:hover{background:var(--bg3)}
.topic-chip.sel-chip{border-color:var(--green);color:var(--green-text);background:var(--green-bg)}
@media(max-width:480px){
  #app{padding:10px}
  .start-h{font-size:20px}
  .big-s{font-size:48px}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
  .stat-c{padding:10px 8px}
  .stat-v{font-size:18px}
  .hud{gap:4px}
  .hc{padding:5px 9px}
  .tgrid{grid-template-columns:repeat(2,1fr)}
}

/* ── LOGIN ── */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:20px;text-align:center}
.login-logo{font-size:52px;line-height:1;margin-bottom:6px}
.login-h{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.3}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.6}
.login-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.login-input{background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .15s}
.login-input:focus{border-color:var(--green)}
.login-input::placeholder{color:var(--text3)}
.login-name-row{display:flex;gap:8px}
/* ── COURSE SELECTION ── */
.course-wrap{padding:16px 0}
.course-h{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px}
.course-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.6}
.course-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.course-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:border-color .15s,background .15s;display:flex;align-items:flex-start;gap:14px;text-align:left}
.course-card:hover:not(.course-disabled){background:var(--bg3);border-color:#5A6080}
.course-card.course-active{border-color:var(--green);background:var(--green-bg)}
.course-card.course-disabled{opacity:.45;cursor:not-allowed}
.course-icon{font-size:28px;line-height:1;flex-shrink:0;margin-top:2px}
.course-title{font-size:13px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:3px}
.course-desc{font-size:11px;color:var(--text2);line-height:1.55}
.course-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;margin-top:5px;border:.5px solid}
.course-user-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px}
/* ── LIMIT OVERLAY ── */
.limit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.limit-box{background:var(--bg2);border:1.5px solid var(--red);border-radius:var(--radius);padding:24px 22px;max-width:360px;width:100%;text-align:center;animation:slideUp .25s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.limit-icon{font-size:44px;margin-bottom:8px}
.limit-title{font-size:16px;font-weight:700;color:var(--red-text);margin-bottom:6px}
.limit-msg{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:18px}
.limit-btns{display:flex;flex-direction:column;gap:8px}

/* ── Custom Modal ── */
.cmodal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.cmodal{background:var(--bg2);border:.5px solid var(--border);border-radius:14px;padding:24px 22px 20px;max-width:340px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.cmodal-title{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--text)}
.cmodal-msg{font-size:13px;color:var(--text2);margin-bottom:18px;line-height:1.5}
.cmodal-input{width:100%;padding:10px 12px;border-radius:8px;border:.5px solid var(--border2);background:var(--bg3);color:var(--text);font-size:14px;margin-bottom:16px;box-sizing:border-box}
.cmodal-input:focus{outline:none;border-color:var(--blue)}
.cmodal-btns{display:flex;gap:8px}
.cmodal-btns .btn{flex:1;padding:10px;font-size:13px;border-radius:8px}
.btn-danger{background:var(--red-bg);border:.5px solid var(--red);color:var(--red-text)}
.btn-ghost{background:transparent;border:.5px solid var(--border);color:var(--text2)}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.cmodal-btns-wrap{display:flex;flex-direction:column;gap:8px}
.cmodal-btns-wrap .btn-ghost{width:100%;padding:10px;font-size:13px;border-radius:8px}


/* ── GLOSSÁRIO ── */
.gloss-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9998;display:flex;align-items:flex-end;justify-content:center;padding:0}
.gloss-box{background:var(--bg2);border-top:.5px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:540px;max-height:90vh;display:flex;flex-direction:column}
.gloss-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 0;flex-shrink:0}
.gloss-hdr{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.gloss-htitle{font-size:14px;font-weight:700}
.gloss-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:4px;font-family:var(--font)}
.gloss-close:hover{color:var(--text);background:var(--bg3)}
.gloss-search{margin:0 14px 8px;padding:9px 12px;border-radius:8px;border:.5px solid var(--border2);background:var(--bg3);color:var(--text);font-size:13px;font-family:var(--font);outline:none;flex-shrink:0;width:auto}
.gloss-search:focus{border-color:var(--blue)}
.gloss-letters{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:0 14px 10px;flex-shrink:0;scrollbar-width:none}
.gloss-letters::-webkit-scrollbar{display:none}
.gloss-ltr{padding:3px 7px;border-radius:6px;border:.5px solid var(--border2);font-size:11px;font-weight:700;cursor:pointer;color:var(--text2);background:var(--bg3);white-space:nowrap;flex-shrink:0;transition:all .12s}
.gloss-ltr.g-act{background:var(--blue);border-color:var(--blue);color:#fff}
.gloss-list{overflow-y:auto;padding:0 14px 24px;display:flex;flex-direction:column;gap:5px}
.gloss-item{background:var(--bg3);border:.5px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:background .12s}
.gloss-item:hover,.gloss-item.g-open{background:var(--bg);border-color:var(--border2)}
.gloss-item-head{display:flex;align-items:center;gap:8px}
.gloss-acr{font-size:13px;font-weight:700;color:var(--blue-text);min-width:64px;flex-shrink:0}
.gloss-short{font-size:11px;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gloss-chevron{font-size:10px;color:var(--text3);transition:transform .15s;flex-shrink:0}
.gloss-item.g-open .gloss-chevron{transform:rotate(180deg)}
.gloss-body{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.7;padding-top:8px;border-top:.5px solid var(--border);display:none}
.gloss-item.g-open .gloss-body{display:block}
.gloss-body strong{color:var(--text)}
.gloss-count{font-size:10px;color:var(--text3);padding:0 14px 4px;flex-shrink:0}

/* ── PRONTIDÃO ── */
.ready-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:9998;display:flex;align-items:flex-end;justify-content:center;padding:0}
.ready-box{background:var(--bg2);border-top:.5px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:540px;max-height:90vh;display:flex;flex-direction:column}
.ready-hdr{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ready-htitle{font-size:14px;font-weight:700}
.ready-body{overflow-y:auto;padding:8px 16px 28px;display:flex;flex-direction:column;gap:12px}
.ready-score{text-align:center;padding:10px 0 4px}
.ready-pct{font-size:52px;font-weight:800;line-height:1}
.ready-label{font-size:11px;color:var(--text2);margin-top:3px}
.ready-msg{font-size:12px;color:var(--text3);margin-top:6px;font-style:italic}
.ready-section{background:var(--bg3);border:.5px solid var(--border);border-radius:10px;padding:12px 14px}
.ready-stitle{font-size:12px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ready-topic-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:.5px solid var(--border)}
.ready-topic-row:last-child{border-bottom:none}
.ready-tp-name{font-size:12px;color:var(--text);flex:1}
.ready-tp-bar{width:70px;height:7px;background:var(--bg2);border-radius:4px;overflow:hidden;flex-shrink:0}
.ready-tp-fill{height:100%;border-radius:4px;transition:width .6s ease}
.ready-tp-pct{font-size:11px;font-weight:700;min-width:32px;text-align:right;flex-shrink:0}
.ready-plan-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:.5px solid var(--border)}
.ready-plan-row:last-child{border-bottom:none}
.ready-day-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--blue-bg);color:var(--blue-text);border:.5px solid var(--blue);white-space:nowrap;flex-shrink:0;margin-top:1px}
.ready-plan-topic{font-size:12px;color:var(--text);font-weight:600}
.ready-plan-action{font-size:11px;color:var(--text2)}
.ready-no-data{font-size:13px;color:var(--text2);text-align:center;padding:28px 0;line-height:2}
.ready-feat-row{display:flex;gap:8px;margin-bottom:14px}
.ready-feat-btn{flex:1;font-size:12px}

</style>

E91.7799 / IP origem: 10.1.1.10","MAC origem: 00E0.FE10.17A3 / IP origem: 192.168.1.1","MAC origem: 00E0.FE91.7799 / IP origem: 10.1.1.1"],cor:2,sub:"Encapsulamento de quadro a cada hop",why:"O endereço IP origem nunca muda durante o roteamento (permanece 10.1.1.10 — host A). O MAC origem, porém, é substituído a cada hop: ao chegar ao host B o MAC origem é o da interface de saída do último roteador (00E0.FE91.7799)."},
{id:2,tp:"Switching",ty:"match",text:"Faça a correspondência de cada etapa com sua descrição na sequência de inicialização do switch.",pairs:[{l:"Etapa 1",r:"Executar o POST (Power-On Self-Test)"},{l:"Etapa 2",r:"Carregar o boot loader da ROM"},{l:"Etapa 3",r:"Inicializar os registradores da CPU"},{l:"Etapa 4",r:"Inicializar o sistema de arquivos em flash"},{l:"Etapa 5",r:"Transferir o controle do switch para o IOS"},{l:"Etapa 6",r:"Entrar no modo de configuração global"}],sub:"Sequência de boot do switch Cisco",why:"Ordem padrão Cisco: (1) POST testa hardware; (2) boot loader é carregado da ROM; (3) boot loader inicializa registradores CPU; (4) boot loader inicializa flash; (5) IOS é carregado e recebe controle; (6) arquivo de configuração é carregado e entra em modo de configuração global."},
{id:3,tp:"VLANs",ty:"single",text:"Um administrador está tentando remover as configurações de um switch. Após usar o comando erase startup-config e reiniciar o switch, o administrador descobre que as VLANs 10 e 100 ainda estão presentes. Por que essas VLANs não foram removidas?",opts:["Essas VLANs são VLANs padrão e não podem ser removidas.","Essas VLANs não podem ser removidas a menos que o switch esteja no modo cliente VTP.","Essas VLANs só podem ser removidas com os comandos no vlan 10 e no vlan 100.","As VLANs são armazenadas em um arquivo chamado vlan.dat na memória flash, que precisa ser apagado manualmente."],cor:3,sub:"Arquivo vlan.dat na memória flash",why:"O comando erase startup-config apaga apenas a startup-config na NVRAM. As VLANs criadas pelo usuário são gravadas em vlan.dat na flash. Para removê-las, é necessário executar 'delete flash:vlan.dat' e reiniciar o switch."},

{id:8,tp:"Roteamento",ty:"single",text:"Como um roteador tratará o roteamento estático se o Cisco Express Forwarding (CEF) estiver desabilitado?",opts:["Ele não executará pesquisas recursivas.","Interfaces ponto-a-ponto seriais exigirão rotas estáticas totalmente especificadas para evitar inconsistências.","Interfaces multiacesso Ethernet exigirão rotas estáticas totalmente especificadas para evitar inconsistências.","Rotas estáticas que usam uma interface de saída serão desnecessárias."],cor:2,sub:"CEF desabilitado — rotas em interfaces Ethernet",why:"Quando o CEF está desabilitado, o roteador usa process switching. Em interfaces multiacesso (Ethernet), é necessário especificar tanto a interface de saída quanto o próximo salto (rota totalmente especificada), pois sem CEF a resolução ARP pode falhar com apenas o next-hop."},

de unicast desconhecido — tabela MAC vazia",why:"Com a tabela MAC vazia, o SW1 não sabe em qual porta está o destino. O switch realiza flooding: envia o quadro por TODAS as portas exceto a porta de entrada (Fa0/1). Isso inclui a porta trunk para SW2, que por sua vez também fará flooding para PCC e PCD."},
{id:10,tp:"Switching",ty:"multi",text:"Quais são os dois motivos pelos quais um administrador de redes segmentaria uma rede com um switch de Camada 2? (Escolha duas.)",opts:["para criar menos domínios de colisão","para melhorar a largura de banda disponível para os usuários","para criar mais domínios de broadcast","para eliminar circuitos virtuais","para isolar o tráfego entre os segmentos","para isolar mensagens ARP do restante da rede"],cor:[1,4],sub:"Benefícios da segmentação com switch L2",why:"Um switch L2 cria um domínio de colisão por porta (mais domínios, não menos). Os benefícios reais da segmentação são: (1) melhorar a largura de banda — cada porta tem largura de banda dedicada; (2) isolar o tráfego entre segmentos — frames só cruzam para outras portas quando necessário."},
{id:11,tp:"Inter-VLAN",ty:"single",code:"R1# config terminal\nEnter configuration commands, one per line.  End with CNTL/Z.\nR1(config)# interface gigabitEthernet 0/0.1\nR1(config-subif)# encapsulation dot1Q 10\nR1(config-subif)# ip add 192.168.10.254 255.255.255.0\nR1(config-subif)# interface gigabitEthernet 0/0.20\nR1(config-subif)# encapsulation dot1Q 2\nR1(config-subif)# ip add 192.168.20.254 255.255.255.0\nR1(config-subif)# exit\nR1(config)# interface gigabitEthernet 0/0\nR1(config-if)# no shutdown",text:"Um administrador configura o roteador R1 para roteamento entre VLAN 10 e VLAN 20. Os dispositivos das VLANs não conseguem se comunicar. Com base na configuração exibida, qual é a causa provável do problema?",opts:["O número da subinterface GigabitEthernet 0/0.1 está incorreto.","A porta Gi0/0 do switch conectado ao roteador deve ser configurada como porta de tronco.","O encapsulamento está configurado incorretamente em uma das subinterfaces.","Um comando no shutdown deve ser adicionado em cada subinterface."],cor:1,sub:"Router-on-a-stick — porta do switch deve ser trunk",why:"No roteamento inter-VLAN router-on-a-stick, a porta do switch conectada à interface física do roteador (Gi0/0) deve ser configurada como modo trunk. Se estiver em modo access, somente o tráfego de uma VLAN passará, impedindo a comunicação entre VLANs."},
{id:12,tp:"DHCPv4",ty:"single",code:"R1(config)# ip dhcp excluded-address 192.168.10.2 192.168.10.9\nR1(config)# ip dhcp excluded-address 192.168.10.254\nR1(config)# ip dhcp pool LAN-POOL-1\nR1(dhcp-config)# network 192.168.10.0 255.255.255.0\nR1(dhcp-config)# default-router 192.168.10.1\nR1(dhcp-config)# dns-server 192.168.11.5\nR1(dhcp-config)# domain-name example.com\nR1(dhcp-config)# end",text:"Considerando que o gateway padrão (192.168.10.1) e o servidor DNS (192.168.11.5) estão corretos, qual é o problema nessa configuração DHCP?",opts:["O servidor DNS e o gateway padrão devem estar na mesma sub-rede.","O endereço IP do gateway padrão não está na lista de endereços excluídos.","Os comandos default-router e dns-server precisam ser configurados com máscaras de sub-rede.","O endereço IP do servidor DNS não está na lista de endereços excluídos."],cor:1,sub:"Exclusão do gateway padrão no pool DHCP",why:"O gateway padrão 192.168.10.1 pertence à sub-rede 192.168.10.0/24 do pool, mas não foi adicionado à lista de exclusão (ip dhcp excluded-address). Isso pode causar conflito de endereço se o DHCP atribuir esse IP a um cliente."},
{id:13,tp:"STP",ty:"multi",text:"Quais os dois protocolos spanning tree que podem causar uso insuficiente de tráfego porque assumem somente uma instância de spanning tree para toda a rede bridged? (Escolha duas.)",opts:["STP","Rapid PVST+","PVST+","MSTP","RSTP"],cor:[0,4],sub:"STP e RSTP — única instância para toda a rede",why:"STP (802.1D) e RSTP (802.1w) usam uma única instância de spanning tree para todas as VLANs, independentemente de quantas existam. Isso pode bloquear links que poderiam ser usados por VLANs diferentes, resultando em uso ineficiente. PVST+ e Rapid PVST+ criam uma instância por VLAN."},

{id:15,tp:"STP",ty:"multi",text:"Para obter uma visão geral do spanning tree de uma rede comutada, um engenheiro emite o comando show spanning-tree. Quais dois itens são exibidos por esse comando? (Escolha duas.)",opts:["O BID (Bridge ID) da bridge raiz","A função das portas em todas as VLANs","O status das portas de VLANs nativas","O número de broadcasts recebidos em cada porta raiz","O endereço IP da interface VLAN de gerenciamento"],cor:[0,1],sub:"Saída do show spanning-tree",why:"O comando 'show spanning-tree' exibe: o BID da root bridge (incluindo prioridade e MAC); a função e estado de cada porta por VLAN (root, designated, alternate, blocking, forwarding, etc.). Não exibe estatísticas de broadcast nem endereços IP de gerenciamento."},
{id:16,tp:"WLAN",ty:"single",text:"Que método de autenticação sem fio depende de um servidor de autenticação RADIUS?",opts:["WEP","WPA Personal","WPA2 Personal","WPA2 Enterprise"],cor:3,sub:"WPA2 Enterprise — autenticação via RADIUS",why:"WPA2 Enterprise usa o protocolo 802.1X com EAP, que requer um servidor RADIUS para autenticar usuários individualmente com credenciais (usuário/senha ou certificados). WPA/WPA2 Personal utilizam apenas uma chave pré-compartilhada (PSK), sem necessidade de servidor RADIUS."},
{id:17,tp:"WLAN",ty:"single",text:"Qual é o método de criptografia sem fio mais seguro disponível atualmente?",opts:["WPA","WEP","WPA2 com TKIP","WPA2 com AES"],cor:3,sub:"WPA2-AES — criptografia mais forte",why:"WPA2 com AES (Advanced Encryption Standard, 128-bit) é o método mais seguro. WEP é facilmente quebrado. WPA com TKIP é obsoleto. WPA2 com TKIP é mais forte que WEP/WPA, mas ainda inferior ao AES. WPA2-AES é o padrão atual recomendado (base do WPA3)."},
{id:18,tp:"WLAN",ty:"single",text:"Um engenheiro decide configurar um SSID na banda de 5 GHz para melhorar o desempenho de serviços de streaming de vídeo. Por que essa solução pode melhorar o desempenho da rede sem fio para esse tipo de serviço?",opts:["A banda de 5 GHz tem maior alcance e provavelmente é livre de interferência.","Exigir que usuários mudem para 5 GHz é inconveniente e reduzirá o número de usuários.","A banda de 5 GHz tem mais canais disponíveis e é menos congestionada que a de 2,4 GHz, sendo mais adequada para multimídia.","Apenas usuários com placas de rede mais recentes podem usar 5 GHz, reduzindo o uso geral."],cor:2,sub:"Banda de 5 GHz — menos congestionamento para multimídia",why:"A banda de 5 GHz oferece mais canais não sobrepostos (23 canais de 20 MHz vs. 3 na de 2,4 GHz) e sofre menos interferência de dispositivos domésticos (micro-ondas, Bluetooth). Isso resulta em maior throughput e menor latência para streaming de vídeo. A desvantagem é o menor alcance comparado a 2,4 GHz."},
{id:19,tp:"EtherChannel",ty:"multi",code:"S1# show etherchannel summary\nFlags:  D - down        P - bundled in port-channel\n        I - stand-alone s - suspended\n        H - Hot-standby (LACP only)\n        R - Layer3      S - Layer2\n        U - in use      f - failed to allocate aggregator\n        M - not in use, minimum links not met\n        u - unsuitable for bundling\n        w - waiting to be aggregated\n        d - default port\nNumber of channel-groups in use: 1\nNumber of aggregators:           1\n\nGroup  Port-channel  Protocol    Ports\n------+-------------+-----------+-----------------------------------------------\n1      Po2(SD)       -           Fa0/1(D)    Fa0/2(D)",text:"Considere a saída do comando show etherchannel summary acima. Quais as duas conclusões que podem ser obtidas? (Escolha duas.)",opts:["O EtherChannel está inoperante.","O ID do port-channel é 2.","O port-channel é de Camada 3.","O pacote está totalmente operacional.","O método de balanceamento de carga é da porta origem para destino."],cor:[0,1],sub:"Flags SD e D no show etherchannel summary",why:"O flag 'S' indica Layer 2 e 'D' indica Down. 'Po2(SD)' significa que o port-channel 2 está inativo (Down). As portas Fa0/1(D) e Fa0/2(D) também estão inativas. O ID do port-channel é 2 (Po2). O EtherChannel está inoperante — não há protocolo (−) negociando."},

==" style="max-width:100%;width:406px;height:auto;display:block;margin:0 auto;border-radius:4px;" alt="Q22 diagram">`,opts:["O SSID é transmitido (broadcast).","A filtragem de endereços MAC está habilitada.","A criptografia WEP está ativada.","O canal sem fio é selecionado automaticamente.","Uma senha de administrador conhecida/padrão está definida."],cor:[0,4],sub:"Configurações padrão inseguras em roteadores sem fio",why:"SSID em broadcast expõe o nome da rede a qualquer dispositivo próximo. A senha de administrador padrão (ex.: 'admin', 'password') é amplamente conhecida e permite acesso ao painel de configuração. Ambas devem ser alteradas na configuração inicial de segurança."},
{id:23,tp:"Segurança L2",ty:"single",text:"Durante o processo AAA, quando a autorização será implementada?",opts:["Imediatamente após a autenticação bem-sucedida em uma fonte de dados AAA","Imediatamente após a contabilidade e auditoria da AAA receberem relatórios detalhados","Imediatamente após um cliente AAA enviar informações de autenticação ao servidor centralizado","Imediatamente após a determinação de quais recursos um usuário pode acessar"],cor:0,sub:"AAA — ordem: autenticação → autorização → contabilidade",why:"No modelo AAA: (A) Autenticação verifica a identidade; (A) Autorização determina o que o usuário autenticado pode fazer — ocorre imediatamente após autenticação bem-sucedida; (A) Contabilidade registra o que foi feito. A autorização só acontece após a identidade ser confirmada."},
{id:24,tp:"DHCPv4",ty:"single",text:"Que ação um cliente DHCPv4 toma se receber mais de um DHCPOFFER de vários servidores DHCP?",opts:["Descarta ambas as ofertas e envia um novo DHCPDISCOVER.","Envia um DHCPREQUEST identificando qual oferta de locação está aceitando.","Envia um DHCPNAK e inicia o processo DHCP novamente.","Aceita ambas as mensagens DHCPOFFER e envia um DHCPACK."],cor:1,sub:"DORA — cliente aceita a primeira oferta com DHCPREQUEST",why:"O cliente aceita normalmente a primeira oferta recebida e responde com um DHCPREQUEST broadcast, que inclui o Server Identifier do servidor escolhido. Os demais servidores veem esse broadcast e retornam suas ofertas ao pool. O servidor escolhido responde com DHCPACK para concluir a negociação."},

{id:26,tp:"Segurança L2",ty:"single",text:"Um administrador encontrou um usuário enviando um quadro 802.1Q com duas tags (double tagging) para um switch. Qual é a melhor solução para prevenir esse tipo de ataque (VLAN hopping)?",opts:["As VLANs das portas de acesso de usuário devem ser diferentes das VLANs nativas usadas nas portas de tronco.","As portas de tronco devem usar a VLAN padrão (VLAN 1) como VLAN nativa.","As portas de tronco devem ser configuradas com port security.","A VLAN nativa usada em qualquer tronco deve ser uma das VLANs de dados ativas."],cor:0,sub:"VLAN hopping por double tagging — mitigação",why:"O ataque de double tagging explora o fato de que a tag da VLAN nativa é removida pelo switch. Se um atacante na VLAN 10 enviar um frame com duas tags (VLAN 10 externa, VLAN 20 interna), o switch remove a tag 10 (nativa) e encaminha na VLAN 20. A mitigação é garantir que as portas de acesso de usuário estejam em VLANs diferentes da VLAN nativa dos troncos."},
{id:27,tp:"Switching",ty:"match",text:"Faça a correspondência de cada característica com o método de encaminhamento de switch correto.",pairs:[{l:"Adequado para aplicações de computação de alto desempenho",r:"Cut-through"},{l:"O processo de encaminhamento inicia após receber o endereço MAC destino",r:"Cut-through"},{l:"Pode enviar quadros com erros (inválidos)",r:"Cut-through"},{l:"Verifica erros no frame antes de encaminhar (CRC)",r:"Store-and-forward"},{l:"O encaminhamento só inicia após receber o quadro inteiro",r:"Store-and-forward"},{l:"Encaminha apenas frames válidos (sem erros)",r:"Store-and-forward"}],sub:"Cut-through vs Store-and-forward",why:"Cut-through inicia o encaminhamento assim que lê o MAC destino — menor latência, maior desempenho, mas pode propagar frames com erros. Store-and-forward aguarda o frame completo para verificar o FCS (CRC) — maior latência, mas garante que apenas frames válidos são encaminhados."},

"R2(config)# ip route 172.16.2.0 255.255.255.0 172.16.2.254","R2(config)# ip route 172.16.2.0 255.255.255.0 172.16.3.1","R2(config)# ip route 172.16.3.0 255.255.255.0 172.16.2.254"],cor:2,sub:"Rota estática — rede destino + próximo salto",why:"O R2 precisa chegar à rede 172.16.2.0/24 via R1. O próximo salto é 172.16.3.1 (interface de R1 no link entre os roteadores). O comando correto é: ip route 172.16.2.0 255.255.255.0 172.16.3.1. O destino deve ser o endereço de rede (não host) e o next-hop deve ser alcançável diretamente."},
{id:29,tp:"Switching",ty:"single",text:"Qual instrução está correta sobre como um switch de Camada 2 determina como encaminhar quadros?",opts:["Quadros unicast são sempre encaminhados, independentemente do endereço MAC destino.","Apenas quadros com endereço de broadcast são encaminhados por todas as portas ativas.","O encaminhamento cut-through garante que quadros inválidos sejam descartados.","Decisões de encaminhamento são baseadas em endereços MAC e mapeamentos de porta na tabela CAM."],cor:3,sub:"Tabela CAM — base das decisões de encaminhamento",why:"O switch usa a tabela CAM (Content Addressable Memory), também chamada de tabela MAC, que mapeia endereços MAC às portas. Quando um frame chega, o switch consulta a tabela para determinar a porta de saída. Se o MAC destino não estiver na tabela, o switch realiza flooding."},

{id:31,tp:"Segurança L2",ty:"single",text:"Uma política de segurança exige que endereços MAC sejam aprendidos dinamicamente e adicionados tanto à tabela de endereços MAC quanto à configuração de execução (running-config) do switch. Qual configuração de port security implementa isso?",opts:["auto secure MAC addresses","dynamic secure MAC addresses","static secure MAC addresses","sticky secure MAC addresses"],cor:3,sub:"Sticky MAC — aprendizado dinâmico salvo na config",why:"O recurso 'sticky' (switchport port-security mac-address sticky) permite que o switch aprenda automaticamente os MACs conectados e os salve na running-config como endereços seguros estáticos. Isso combina a facilidade do aprendizado dinâmico com a persistência da configuração estática."},
{id:32,tp:"Roteamento",ty:"single",code:"S  10.17.2.0/24 [1/0] via 10.16.2.2\nS  0.0.0.0/0 [1/0] via 10.16.2.2\nC  10.16.2.0/24 is directly connected, Serial0/0/0\nS  10.17.2.0/24 is directly connected, Serial 0/0/0",text:"Consulte a tabela de roteamento exibida. Qual entrada representa uma rota estática para uma rede específica configurada com endereço de próximo salto?",opts:["S 10.17.2.0/24 [1/0] via 10.16.2.2","S 0.0.0.0/0 [1/0] via 10.16.2.2","C 10.16.2.0/24 is directly connected, Serial0/0/0","S 10.17.2.0/24 is directly connected, Serial 0/0/0"],cor:0,sub:"Leitura da tabela de roteamento — rota estática com next-hop",why:"A entrada 'S 10.17.2.0/24 [1/0] via 10.16.2.2' indica: S=rota estática, rede específica 10.17.2.0/24, AD=1, métrica=0, próximo salto=10.16.2.2. Isso é uma rota estática para rede específica com next-hop. A rota 0.0.0.0/0 é a rota padrão, não específica."},
{id:33,tp:"Roteamento",ty:"single",text:"Qual prefixo IPv6 foi projetado para comunicação link-local?",opts:["fe80::/10","fc::/07","2001::/3","ff00::/8"],cor:0,sub:"Endereços link-local IPv6 — fe80::/10",why:"Endereços com prefixo fe80::/10 são link-local — válidos apenas no segmento de rede local e não roteáveis. São usados para comunicação entre vizinhos (NDP, routing protocols). São configurados automaticamente em toda interface IPv6 habilitada. ff00::/8 é multicast; 2001::/3 é unicast global; fc::/7 é unicast local único (ULA)."},
{id:34,tp:"Roteamento",ty:"single",text:"Depois que um host gera um endereço IPv6 por DHCPv6 ou SLAAC, como ele verifica se o endereço é único e utilizável?",opts:["O host envia uma mensagem de echo request ICMPv6 ao endereço aprendido e, se não houver resposta, considera-o único.","O host envia uma mensagem Neighbor Solicitation ICMPv6 ao endereço aprendido e, se não receber Neighbor Advertisement, considera-o único.","O host verifica no cache de vizinhos local e, se o endereço não estiver armazenado, considera-o único.","O host envia um broadcast ARP no link local e, se não houver resposta, considera o endereço único."],cor:1,sub:"DAD — Duplicate Address Detection (ICMPv6 NS/NA)",why:"O processo DAD (Duplicate Address Detection) usa mensagens ICMPv6 Neighbor Solicitation (NS) enviadas ao endereço multicast solicited-node do novo endereço. Se nenhuma mensagem Neighbor Advertisement (NA) for recebida, o endereço é considerado único e é atribuído à interface. ARP é IPv4; IPv6 usa NDP."},
{id:35,tp:"Segurança L2",ty:"single",text:"Qual ataque de rede busca criar um DoS para clientes, impedindo-os de obter um endereço DHCP?",opts:["Privação de DHCP (DHCP starvation)","DHCP Spoofing","Spoofing de endereço IP","Ataque de tabela CAM"],cor:0,sub:"DHCP Starvation — esgotamento do pool DHCP",why:"O ataque de DHCP starvation usa ferramentas como Gobbler para enviar centenas de DHCPDISCOVER com MACs falsificados aleatórios, esgotando o pool de endereços do servidor. Clientes legítimos não conseguem obter IP (DoS). DHCP Spoofing implanta um servidor DHCP falso para redirecionar tráfego."},
{id:36,tp:"Segurança L2",ty:"single",text:"Qual é uma opção de configuração segura para acesso remoto a um dispositivo de rede?",opts:["Configurar SSH","Configurar Telnet","Configurar 802.1x","Configurar uma ACL e aplicá-la às linhas VTY"],cor:0,sub:"SSH — acesso remoto seguro e criptografado",why:"SSH (Secure Shell) criptografa todo o tráfego da sessão, incluindo credenciais. Telnet transmite tudo em texto claro, sendo vulnerável a sniffing. 802.1x é usado para autenticação de acesso à porta (não gerenciamento remoto). ACL nas VTY restringe quem pode acessar, mas não criptografa a sessão — deve ser combinada com SSH."},
{id:37,tp:"WLAN",ty:"single",text:"Um técnico conecta quatro PCs a um switch, configura o SSID e as propriedades de autenticação de uma WLAN, testa a conectividade e configura um firewall antes de conectar à Internet. Que tipo de dispositivo de rede inclui todas essas funcionalidades?",opts:["Switch","Roteador sem fio","Dispositivo de firewall dedicado","Ponto de acesso sem fio autônomo"],cor:1,sub:"Roteador sem fio — switch + AP + roteador + firewall",why:"Um roteador sem fio residencial/SOHO combina: switch Ethernet (portas LAN), ponto de acesso Wi-Fi (SSID/autenticação), roteador (conectividade WAN/Internet) e firewall básico (NAT, filtragem de pacotes). É o dispositivo all-in-one descrito na questão."},

rder-radius:4px;" alt="Q38 diagram">`,opts:["Adicionar o endereço de próximo salto 192.168.0.38.","Alterar a distância administrativa para 1.","Alterar a rede destino para 192.168.0.34.","Alterar a distância administrativa para 120."],cor:3,sub:"Rota estática flutuante — AD deve ser maior que OSPF (110)",why:"OSPF tem distância administrativa 110. Para que a rota estática seja flutuante (backup), sua AD deve ser maior que 110. Com AD=100, a rota estática é preferida em relação ao OSPF (100 < 110). Alterar para AD=120 garante que o OSPF seja preferido enquanto ativo, e o backup só é ativado quando o OSPF falha."},
{id:39,tp:"Roteamento",ty:"single",text:"Qual é o tipo de rota estática configurada com uma distância administrativa maior para fornecer uma rota de backup quando o protocolo de roteamento dinâmico falha?",opts:["Rota estática padrão","Rota estática flutuante","Rota estática de host","Rota estática de sumarização"],cor:1,sub:"Rota estática flutuante — definição",why:"Uma rota estática flutuante tem distância administrativa maior que a do protocolo de roteamento dinâmico. Enquanto o protocolo dinâmico estiver funcionando, a rota estática não aparece na tabela (fica 'flutuando'). Quando a rota dinâmica desaparece, a rota estática entra em ação como backup."},

{id:41,tp:"Roteamento",ty:"single",code:"R1(config)# do show ip route\n<saida omitida>\n\nGateway of last resort is 0.0.0.0 to network 0.0.0.0\n\n10.0.0.0/8 is variably subnetted, 2 subnets, 2 masks\nC  10.0.0.0/30 is directly connected, Serial0/0/0\nL  10.0.0.1/32 is directly connected, Serial0/0/0\n172.16.0.0/24 is subnetted, 1 subnets\nR  172.16.1.0/24 [120/1] via 10.0.0.2, 00:00:04, Serial0/0/0\n192.168.10.0/24 is variably subnetted, 2 subnets, 2 masks\nC  192.168.10.0/24 is directly connected, GigabitEthernet0/1\nL  192.168.10.1/32 is directly connected, GigabitEthernet0/1\n192.168.11.0/24 is variably subnetted, 2 subnets, 2 masks\nC  192.168.11.0/24 is directly connected, GigabitEthernet0/0\nL  192.168.11.1/32 is directly connected, GigabitEthernet0/0\nS*  0.0.0.0/0 is directly connected, Serial0/0/0",text:"Consulte a tabela de roteamento com a entrada RIP acima. Qual rota estática flutuante um técnico precisa inserir para criar backup para a rede 172.16.1.0, que só deve ser usada se o RIP primário falhar?",opts:["ip route 172.16.1.0 255.255.255.0 s0/0/0 91","ip route 172.16.1.0 255.255.255.0 s0/0/0","ip route 172.16.1.0 255.255.255.0 s0/0/0 111","ip route 172.16.1.0 255.255.255.0 s0/0/0 121"],cor:3,sub:"Rota flutuante com AD > RIP (120)",why:"RIP tem distância administrativa 120. Para uma rota flutuante de backup, a AD deve ser > 120. AD=121 garante que a rota estática só entre em ação quando a rota RIP desaparecer. AD=111 seria incorreto pois 111 < 120, tornando a estática preferida ao RIP. AD=91 seria preferida ao EIGRP mas incorreta para backup de RIP."},
{id:42,tp:"Roteamento",ty:"single",code:"R1# show ipv6 route\n<saida omitida>\n\nS  ::/0 [1/0]\n   via Serial0/0/0, directly connected\nC  2001:DB8:CAFE:1::/64 [0/0]\n   via GigabitEthernet0/1, directly connected\nL  2001:DB8:CAFE:1::1/128 [0/0]\n   via GigabitEthernet0/1, receive\nC  2001:DB8:CAFE:2::/64 [0/0]\n   via GigabitEthernet0/0, directly connected\nL  2001:DB8:CAFE:2::1/128 [0/0]\n   via GigabitEthernet0/0, receive\nC  2001:DB8:CAFE:3::/64 [0/0]\n   via Serial0/0/0, directly connected\nL  2001:DB8:CAFE:3::1/128 [0/0]\n   via Serial0/0/0, receive\nS  2001:DB8:CAFE:4::1/128 [1/0]\n   via Serial0/0/0, directly connected\nL  FF00::/8 [0/0]\n   via Null0, receive",text:"Consulte a tabela de roteamento IPv6 do R1 acima. O que o roteador fará com um pacote destinado a 2001:db8:cafe:5::1?",opts:["Descartar o pacote","Encaminhar pela GigabitEthernet0/1","Encaminhar pela GigabitEthernet0/0","Encaminhar pela interface Serial0/0/0"],cor:3,sub:"Rota padrão IPv6 ::/0 — gateway of last resort",why:"O endereço 2001:db8:cafe:5::1 não corresponde a nenhuma rede específica na tabela (não é :1:, :2:, :3:, nem :4:/128). A correspondência mais longa é a rota padrão ::/0, que aponta para Serial0/0/0. O roteador encaminha o pacote por essa interface."},
{id:43,tp:"Troubleshooting",ty:"match",text:"Faça a correspondência entre o estado do link e o status exibido pelos comandos show interface / show ip interface.",pairs:[{l:"Operacionais (funcionando normalmente)",r:"Ativo / ativo (up/up)"},{l:"Problema na Camada 2 (encapsulamento, keepalive)",r:"Ativo / inativo (up/down)"},{l:"Desativado administrativamente (shutdown)",r:"Administrativamente desativado"},{l:"Problema na Camada 1 (cabo, sinal físico)",r:"Inativo / inativo (down/down)"}],sub:"Status de interface: up/up, up/down, down/down, admin down",why:"'Ativo/ativo' (up/up) = interface funcionando. 'Ativo/inativo' (up/down) = problema L2 (mismatch de encapsulamento, keepalives ausentes). 'Administrativamente desativado' = comando shutdown aplicado. 'Inativo/inativo' (down/down) = problema físico (cabo desconectado, sinal ausente)."},

 ambos os EtherChannels para encaminhar pacotes.","O STP bloqueará um dos EtherChannels redundantes.","O loop resultante criará tempestade de broadcast.","Os dois port-channels serão desligados."],cor:1,sub:"STP bloqueia links redundantes — mesmo EtherChannels",why:"O STP trata cada EtherChannel (port-channel) como um único link lógico. Com dois links lógicos entre os mesmos switches, há um loop de Camada 2. O STP elegerá um deles como blocked (alternativa), permitindo apenas um caminho ativo. O EtherChannel não elimina a necessidade do STP."},

{id:47,tp:"VLANs",ty:"multi",text:"Quais dois modos VTP permitem a criação, modificação e exclusão de VLANs no switch local? (Escolha duas.)",opts:["cliente","slave","servidor","transparente","master","distribuição"],cor:[2,3],sub:"VTP modos servidor e transparente — gerenciamento de VLANs",why:"No modo servidor VTP: VLANs podem ser criadas/modificadas/deletadas localmente e as mudanças são propagadas pelo domínio VTP. No modo transparente: VLANs são gerenciadas localmente (criadas/modificadas/deletadas) mas as mudanças NÃO são propagadas — o switch apenas encaminha mensagens VTP. No modo cliente: não é possível modificar VLANs."},
{id:48,tp:"VLANs",ty:"multi",text:"Um novo switch deve ser adicionado a uma rede existente. O administrador não quer que os técnicos do escritório remoto adicionem novas VLANs, mas o switch deve receber atualizações VLAN do domínio VTP. Quais duas etapas devem ser executadas? (Escolha duas.)",opts:["Configurar um endereço IP no novo switch.","Configurar o nome de domínio VTP existente no novo switch.","Configurar todas as portas dos dois switches em modo acesso.","Configurar o novo switch como cliente VTP.","Ativar a poda VTP (VTP pruning)."],cor:[1,3],sub:"VTP cliente — recebe atualizações, não cria VLANs",why:"Para que o switch receba atualizações VTP sem poder criar VLANs: (1) configurar o mesmo domínio VTP da rede existente (sem isso, o switch ignora mensagens VTP); (2) configurar o modo cliente VTP (switchport mode vtp client). No modo cliente, o switch sincroniza VLANs mas não pode criar/modificar/deletar localmente."},
{id:49,tp:"Segurança L2",ty:"single",text:"Qual técnica de mitigação impediria servidores DHCP invasores (rogue) de fornecer parâmetros de configuração IP falsos aos clientes?",opts:["Desativar o CDP nas portas de borda","Implementar port security nas portas de borda","Ativar o DHCP Snooping","Implementar segurança de porta (port security)"],cor:2,sub:"DHCP Snooping — filtragem de respostas DHCP não autorizadas",why:"DHCP Snooping classifica portas como confiáveis (trusted) ou não confiáveis (untrusted). Mensagens DHCP de servidor (DHCPOFFER, DHCPACK) recebidas em portas não confiáveis são descartadas. Somente a porta conectada ao servidor DHCP legítimo é marcada como trusted. Isso impede servidores rogue de fornecer configurações falsas."},
{id:50,tp:"FHRP",ty:"match",text:"Faça a correspondência do número da etapa com a descrição correta do processo de failover do HSRP.",pairs:[{l:"Etapa 1",r:"O roteador de encaminhamento (ativo) falha"},{l:"Etapa 2",r:"O roteador em standby para de receber mensagens Hello do roteador de encaminhamento"},{l:"Etapa 3",r:"O roteador standby assume a função de encaminhamento, usando os endereços IP e MAC do roteador virtual"}],sub:"HSRP failover — sequência de 3 etapas",why:"O processo de failover HSRP: (1) o roteador ativo falha; (2) o roteador standby detecta a falha ao não receber mensagens Hello dentro do hold time; (3) o standby assume o papel ativo, respondendo pelo IP e MAC virtuais do grupo — transparente para os hosts da rede."},
{id:51,tp:"WLAN",ty:"single",text:"Na interface gráfica do Cisco WLC 3504 (Advanced Summary), qual aba permite que um administrador configure uma WLAN específica com uma política de segurança WPA2?",opts:["WLANs","SEGURANÇA","SEM FIO (WIRELESS)","GERENCIAMENTO"],cor:0,sub:"WLC — configuração de WLAN e segurança WPA2",why:"Na interface do WLC Cisco, a aba 'WLANs' lista todas as redes sem fio configuradas. Ao clicar em uma WLAN específica e acessar a guia 'Security', o administrador pode configurar a política WPA2 (camada 2), incluindo método de autenticação (PSK ou 802.1X) e tipo de criptografia (AES/TKIP)."},
{id:52,tp:"WLAN",ty:"single",text:"Um administrador está configurando a segurança WLAN usando WPA2 PSK em uma pequena empresa. Que credencial os usuários precisarão para conectar seus laptops à WLAN?",opts:["Uma senha de usuário individual","Uma chave pré-compartilhada que corresponde à chave configurada no AP","Um nome de usuário e senha configurados no AP","Nome de usuário e senha da empresa via Active Directory"],cor:1,sub:"WPA2 PSK — chave pré-compartilhada para autenticação",why:"No modo WPA2 Personal (PSK — Pre-Shared Key), todos os dispositivos usam a mesma senha (passphrase) configurada no ponto de acesso. O usuário precisa conhecer essa chave para se conectar. Não há servidor de autenticação. WPA2 Enterprise (com RADIUS/802.1X) usa credenciais individuais por usuário."},
{id:53,tp:"Roteamento",ty:"single",text:"Uma rota estática foi configurada em um roteador, mas a rede destino não existe mais. O que o administrador deve fazer para remover a rota estática da tabela de roteamento?",opts:["Alterar a métrica de roteamento dessa rota.","Nada — a rota estática desaparecerá automaticamente.","Alterar a distância administrativa dessa rota.","Remover a rota com o comando no ip route."],cor:3,sub:"Remoção de rota estática — comando no ip route",why:"Diferente de rotas dinâmicas, rotas estáticas não expiram automaticamente. Para removê-la, o administrador deve usar o comando 'no ip route <rede> <máscara> <next-hop ou interface>'. Alterar métrica ou AD não remove a rota da tabela."},
{id:54,tp:"Switching",ty:"single",text:"Que ação ocorre quando um quadro que entra em um switch possui um endereço MAC destino multicast?",opts:["O switch encaminha o quadro para todas as portas, exceto a porta de entrada.","O switch adiciona o MAC de destino e a porta de entrada à tabela CAM.","O switch atualiza o temporizador de atualização para a entrada existente.","O switch adiciona uma entrada na tabela MAC para o destino e a porta de saída."],cor:0,sub:"Flooding de frames multicast pelo switch",why:"Por padrão (sem IGMP snooping), um switch trata frames com endereço MAC multicast de forma similar a broadcasts: encaminha para todas as portas ativas exceto a porta de entrada (flooding). O switch não aprende endereços multicast na tabela CAM a partir do endereço destino — apenas aprende o MAC origem."},
{id:55,tp:"Inter-VLAN",ty:"multi",text:"Um novo switch de Camada 3 está sendo configurado para roteamento inter-VLAN. Quais são três das etapas necessárias para essa configuração? (Escolha três.)",opts:["Atribuir portas às VLANs","Criar interfaces SVI (Switch Virtual Interface)","Criar as VLANs","Instalar uma rota estática","Implementar um protocolo de roteamento","Ajustar a métrica de rota","Modificar a VLAN padrão"],cor:[0,1,2],sub:"Switch L3 inter-VLAN: criar VLANs, SVIs e atribuir portas",why:"Para roteamento inter-VLAN em um switch L3: (1) criar as VLANs (vlan <id>); (2) criar SVIs (interface vlan <id> + ip address) — uma por VLAN para ser o gateway; (3) atribuir as portas de acesso às VLANs corretas (switchport access vlan). Também é necessário 'ip routing', mas as três etapas essenciais listadas são as três primeiras."},
{id:56,tp:"EtherChannel",ty:"multi",text:"Selecione os três modos usados no protocolo PAgP para estabelecimento de EtherChannel. (Escolha três.)",opts:["on (ligado)","desirable","auto (automático)","active (ativo)","passive (passivo)","extended (estendido)"],cor:[0,1,2],sub:"PAgP: modos on, desirable e auto",why:"PAgP (Port Aggregation Protocol, proprietário Cisco) usa três modos: 'on' (força o canal sem PAgP), 'desirable' (inicia ativamente a negociação) e 'auto' (aguarda passivamente). Os modos 'active' e 'passive' são exclusivos do LACP (IEEE 802.3ad). Um canal PAgP é formado entre desirable-desirable ou desirable-auto."},
{id:57,tp:"STP",ty:"single",text:"Qual protocolo ou tecnologia desabilita caminhos redundantes para eliminar loops na Camada 2?",opts:["STP","DTP","EtherChannel","VTP"],cor:0,sub:"STP — prevenção de loops na Camada 2",why:"O Spanning Tree Protocol (STP/802.1D) previne loops de Camada 2 colocando portas redundantes em estado de bloqueio (blocking). DTP negocia trunking. EtherChannel agrega links (mas não elimina loops por si só). VTP distribui informações de VLAN. Apenas STP é projetado especificamente para eliminar loops L2."},
{id:58,tp:"WLAN",ty:"single",text:"Um administrador está configurando uma WLAN. Por que ele alteraria os endereços IPv4 do pool DHCP padrão configurado no AP?",opts:["Para dificultar que invasores externos identifiquem a faixa de endereços usada na rede, já que a faixa padrão é amplamente conhecida.","Para reduzir o risco de interferência por dispositivos externos como fornos de micro-ondas.","Para restringir o acesso à WLAN apenas a usuários autorizados e autenticados.","Para monitorar o funcionamento da rede sem fio."],cor:0,sub:"Alteração do DHCP padrão no AP — segurança por obscuridade",why:"Roteadores sem fio domésticos geralmente usam faixas conhecidas como 192.168.0.x ou 192.168.1.x. Um atacante que conseguir acesso à rede saberá qual faixa usar. Alterar para uma sub-rede menos óbvia dificulta ataques automatizados e scanning de rede, adicionando uma camada de segurança por obscuridade."},
{id:59,tp:"Troubleshooting",ty:"single",text:"Um administrador observa que um grande número de pacotes está sendo descartado em um dos roteadores de filial. O que deve ser verificado primeiramente?",opts:["Verificar a tabela de roteamento para identificar uma rota estática ausente ou incorreta.","Criar rotas estáticas extras para o mesmo destino com AD=1.","Verificar as estatísticas da rota padrão para sobrecarga.","Criar rotas estáticas para todas as redes internas e uma rota padrão para a Internet."],cor:0,sub:"Diagnóstico de descarte de pacotes — tabela de roteamento",why:"Pacotes descartados (dropped) em um roteador geralmente indicam que o destino não tem correspondência na tabela de roteamento (rota ausente). A primeira ação de troubleshooting deve ser verificar a tabela de roteamento (show ip route) para identificar rotas ausentes ou incorretas antes de tomar outras ações."},
{id:60,tp:"VLANs",ty:"single",text:"Qual é o efeito de inserir o comando switchport mode access em uma interface de switch?",opts:["Ele desativa o DTP (Dynamic Trunking Protocol) em uma interface que não está em modo trunk.","Ele ativa manualmente um link de tronco na interface.","Ele desativa uma porta não utilizada do switch.","Ele habilita o BPDU guard em uma porta específica."],cor:0,sub:"switchport mode access — desativa DTP na porta de acesso",why:"O comando 'switchport mode access' configura a porta como modo acesso permanente e desativa o DTP. A porta não irá negociar nem aceitar trunk. Isso é uma prática de segurança recomendada para portas conectadas a hosts finais, pois impede ataques que exploram a negociação automática de trunk (DTP)."}
];

function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function getLvl(xp){const ls=[{n:"Novato",min:0,max:60},{n:"Trainee",min:60,max:150},{n:"Júnior",min:150,max:280},{n:"Técnico",min:280,max:450},{n:"Especialista",min:450,max:650},{n:"Engineer",min:650,max:900},{n:"CCNA Ready",min:900,max:901}];for(let i=ls.length-1;i>=0;i--)if(xp>=ls[i].min)return{...ls[i],idx:i};return ls[0];}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function toggleFav(id){
  if(favorites.has(id))favorites.delete(id);else favorites.add(id);
  localStorage.setItem('ccna2_favs',JSON.stringify([...favorites]));
  document.querySelectorAll('.fav-btn[data-id]').forEach(b=>{
    if(parseInt(b.dataset.id)===id){
      const on=favorites.has(id);
      b.className='fav-btn'+(on?' fav-on':'');
      b.textContent=on?'⭐':'☆';
    }
  });
}

function formatTime(s){
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0)return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function renderCountdown(){
  const dateStr=getExamDate();
  if(!dateStr){
    return`<div class="countdown-box" style="justify-content:center;gap:12px">
      <span style="font-size:13px;color:var(--text2)">📅 Nenhuma data de prova configurada.</span>
      <button class="btn" id="editExamDate" style="padding:5px 12px;font-size:11px;flex-shrink:0">Definir data</button>
    </div>`;
  }
  const exam=new Date(dateStr+'T08:00:00');
  const now=new Date();
  const diff=exam-now;
  if(diff<=0){
    const examStr=new Date(dateStr+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
    return`<div class="countdown-box" style="justify-content:space-between">

    </div>`;
  }
  const days=Math.floor(diff/864e5);
  const hrs=Math.floor((diff%864e5)/36e5);
  const mins=Math.floor((diff%36e5)/6e4);
  const secs=Math.floor((diff%6e4)/1e3);
  const examStr=new Date(dateStr+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  return`<div class="countdown-box">
    <div style="flex:1">
      <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">⏳ Faltam para o exame (${examStr})</div>

        <div class="cd-unit"><div class="cd-num" id="cd-h">${String(hrs).padStart(2,'0')}</div><div class="cd-lbl">horas</div></div>
        <div class="cd-sep">:</div>
        <div class="cd-unit"><div class="cd-num" id="cd-m">${String(mins).padStart(2,'0')}</div><div class="cd-lbl">min</div></div>
        <div class="cd-sep">:</div>
        <div class="cd-unit"><div class="cd-num" id="cd-s">${String(secs).padStart(2,'0')}</div><div class="cd-lbl">seg</div></div>
      </div>
    </div>
    <button class="btn" id="editExamDate" style="padding:5px 10px;font-size:11px;flex-shrink:0">✏️ Alterar</button>
  </div>`;
}

// ── STATS POR QUESTÃO ──
function renderQStats(){
  const hist=JSON.parse(localStorage.getItem('ccna2_qstats')||'{}');
  const ids=Object.keys(hist).map(Number).sort((a,b)=>{
    const pa=hist[a].t>0?hist[a].c/hist[a].t:1;
    const pb=hist[b].t>0?hist[b].c/hist[b].t:1;
    return pa-pb; // piores primeiro
  });
  if(!ids.length)return`<div style="text-align:center;padding:30px 0;color:var(--text3);font-size:13px">Nenhuma estatística ainda.<br>Complete uma prova para ver.</div>`;
  const rows=ids.slice(0,30).map(id=>{
    const q=Q.find(x=>x.id===id);if(!q)return'';
    const {c,t}=hist[id];const p=t>0?Math.round(c/t*100):0;
    const col=p>=80?'#1D9E75':p>=50?'#BA7517':'#A32D2D';
    return`<div class="qstat-row">
      <div class="qstat-id">#${id}</div>
      <div class="qstat-text">${q.text.substring(0,70)}${q.text.length>70?'…':''}</div>
      <div class="qstat-bar"><div class="qstat-fill" style="width:${p}%;background:${col}"></div></div>
      <div class="qstat-pct" style="color:${col}">${p}%</div>
      <div style="font-size:9px;color:var(--text3);min-width:28px;text-align:right">${c}/${t}</div>
    </div>`;
  }).join('');
  return`<div style="background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:4px 14px">${rows}</div>`;
}
function updateQStats(q,ok){
  const s=JSON.parse(localStorage.getItem('ccna2_qstats')||'{}');
  if(!s[q.id])s[q.id]={c:0,t:0};
  s[q.id].t++;if(ok)s[q.id].c++;
  localStorage.setItem('ccna2_qstats',JSON.stringify(s));
}

async function loadLeaderboard(){
  try{
    const r=await window.storage.get('ccna2_leaderboard',true);
    return r?JSON.parse(r.value):[];
  }catch{return[];}
}
async function saveToLeaderboard(name,pct,xp,correct,wrong){
  try{
    let lb=await loadLeaderboard();
    lb=lb.filter(e=>e.name!==name);
    lb.push({name,pct,xp,correct,wrong,date:new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})});
    lb.sort((a,b)=>b.pct-a.pct||b.xp-a.xp);
    if(lb.length>20)lb=lb.slice(0,20);
    await window.storage.set('ccna2_leaderboard',JSON.stringify(lb),true);
  }catch(e){console.log('Leaderboard unavailable',e);}
}
async function renderLeaderboardHtml(){
  const lb=await loadLeaderboard();
  if(!lb.length)return`<div style="text-align:center;padding:20px 0;color:var(--text3);font-size:13px">Nenhum resultado ainda.<br>Seja o primeiro a completar!</div>`;
  const medals=['🥇','🥈','🥉'];
  const myName=localStorage.getItem('ccna2_studentname')||'';
  return lb.map((e,i)=>{
    const isMe=e.name===myName;
    const col=e.pct>=80?'var(--green-text)':e.pct>=60?'var(--yellow-text)':'var(--red-text)';
    const bg=e.pct>=80?'var(--green-bg)':e.pct>=60?'var(--yellow-bg)':'var(--red-bg)';
    return`<div class="lb-row" style="${isMe?'background:var(--bg3);':''}">
      <div class="lb-pos">${medals[i]||`${i+1}.`}</div>
      <div style="flex:1"><div class="lb-name">${e.name}${isMe?' <span style="font-size:10px;color:var(--text3)">(você)</span>':''}</div><div class="lb-detail">✓ ${e.correct} acertos · ⚡ ${e.xp} XP · ${e.date}</div></div>
      <div class="lb-pct" style="color:${col}">${e.pct}%</div>
    </div>`;
  }).join('');
}
