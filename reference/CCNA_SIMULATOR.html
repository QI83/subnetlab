// ── Custom Modal (replaces browser prompt/confirm) ──────────────
function showModal({title='', message='', showInput=false, inputType='date', inputValue='', inputLabel='', okText='Confirmar', cancelText='Cancelar', extraText='', danger=false, onOk, onCancel, onExtra}){
  const existing=document.getElementById('cmodal-overlay');
  if(existing)existing.remove();
  const el=document.createElement('div');
  el.className='cmodal-overlay';
  el.id='cmodal-overlay';
  el.innerHTML=`<div class="cmodal">
    ${title?`<div class="cmodal-title">${title}</div>`:''}
    ${message?`<div class="cmodal-msg">${message}</div>`:''}
    ${showInput?`<input class="cmodal-input" id="cmodal-input" type="${inputType}" value="${inputValue}" placeholder="${inputLabel}">`:''}
    <div class="cmodal-btns-wrap">
      ${extraText?`<button class="btn btn-ghost" id="cmodal-extra">${extraText}</button>`:''}
      <div class="cmodal-btns">
        <button class="btn" id="cmodal-cancel">${cancelText}</button>
        <button class="btn pri${danger?' btn-danger':''}" id="cmodal-ok">${okText}</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(el);
  // Close on overlay click
  el.addEventListener('click',e=>{if(e.target===el){el.remove();if(onCancel)onCancel();}});
  document.getElementById('cmodal-cancel').addEventListener('click',()=>{el.remove();if(onCancel)onCancel();});
  document.getElementById('cmodal-ok').addEventListener('click',()=>{
    const val=showInput?document.getElementById('cmodal-input').value:true;
    el.remove();
    if(onOk)onOk(val);
  });
  if(extraText)document.getElementById('cmodal-extra').addEventListener('click',()=>{el.remove();if(onExtra)onExtra();});
  // Focus input on open
  if(showInput)setTimeout(()=>document.getElementById('cmodal-input')?.focus(),50);
}


// ── GLOSSÁRIO INTERATIVO ────────────────────────────────────────────
function showGlossary(){
  const existing=document.getElementById('gloss-overlay');
  if(existing){existing.remove();return;}

  // Montar lista de itens: separa "Full Name — Explicação PT"
  const items=Object.entries(ACRONYMS).sort((a,b)=>a[0].localeCompare(b[0])).map(([acr,def])=>{
    const dash=def.indexOf(' \u2014 ');
    const full=dash>-1?def.slice(0,dash):def;
    const expl=dash>-1?def.slice(dash+3):'';
    return{acr,full,expl};
  });
  const letters=[...new Set(items.map(x=>x.acr[0].toUpperCase()))].sort();

  let activeLetter='';
  let searchVal='';

  function filteredItems(){
    const q=searchVal.toLowerCase();
    return items.filter(x=>{
      if(q)return x.acr.toLowerCase().includes(q)||x.full.toLowerCase().includes(q)||x.expl.toLowerCase().includes(q);
      if(activeLetter)return x.acr[0].toUpperCase()===activeLetter;
      return true;
    });
  }

  function renderListHtml(){
    const fi=filteredItems();
    if(!fi.length)return'<div style="text-align:center;color:var(--text3);font-size:12px;padding:24px 0">Nenhum resultado encontrado.</div>';
    return fi.map(x=>`<div class="gloss-item" data-acr="${x.acr}">
      <div class="gloss-item-head">
        <span class="gloss-acr">${x.acr}</span>
        <span class="gloss-short">${x.full}</span>
        <span class="gloss-chevron">&#9660;</span>
      </div>
      <div class="gloss-body">${x.expl?`<strong>${x.full}</strong><br>${x.expl}`:`<strong>${x.full}</strong>`}</div>
    </div>`).join('');
  }

  function countHtml(){
    const n=filteredItems().length;
    return`<div class="gloss-count">${n} termo${n!==1?'s':''} encontrado${n!==1?'s':''}</div>`;
  }

  const el=document.createElement('div');
  el.className='gloss-overlay';el.id='gloss-overlay';
  el.innerHTML=`<div class="gloss-box">
    <div class="gloss-handle"></div>
    <div class="gloss-hdr">
      <span class="gloss-htitle">&#128218; Gloss\u00e1rio CCNA &mdash; ${items.length} termos</span>
      <button class="gloss-close" id="gloss-close">&#x2715;</button>
    </div>
    <input class="gloss-search" id="gloss-search" placeholder="Buscar sigla ou descri\u00e7\u00e3o\u2026" autocomplete="off">
    <div class="gloss-letters" id="gloss-letters">
      <span class="gloss-ltr g-act" data-l="">Todos</span>
      ${letters.map(l=>`<span class="gloss-ltr" data-l="${l}">${l}</span>`).join('')}
    </div>
    <div id="gloss-count-wrap"></div>
    <div class="gloss-list" id="gloss-list"></div>
  </div>`;
  document.body.appendChild(el);

  function refresh(){
    document.getElementById('gloss-count-wrap').innerHTML=countHtml();
    document.getElementById('gloss-list').innerHTML=renderListHtml();
    bindGlossItems();
  }

  el.addEventListener('click',e=>{if(e.target===el)el.remove();});
  document.getElementById('gloss-close').addEventListener('click',()=>el.remove());

  document.getElementById('gloss-letters').addEventListener('click',e=>{
    const btn=e.target.closest('.gloss-ltr');if(!btn)return;
    activeLetter=btn.dataset.l;searchVal='';
    document.getElementById('gloss-search').value='';
    document.querySelectorAll('.gloss-ltr').forEach(b=>b.classList.toggle('g-act',b.dataset.l===activeLetter));
    refresh();
  });

  document.getElementById('gloss-search').addEventListener('input',e=>{

// ── RELATÓRIO DE PRONTIDÃO ──────────────────────────────────────────
function showReadinessReport(){
  const existing=document.getElementById('ready-overlay');
  if(existing){existing.remove();return;}

  const hist=JSON.parse(localStorage.getItem('ccna2_history')||'[]');
  const relevant=hist.filter(h=>h.mode==='\ud83d\udcda'||h.mode==='\u23f1');

  const el=document.createElement('div');
  el.className='ready-overlay';el.id='ready-overlay';

  if(!relevant.length){
    el.innerHTML=`<div class="ready-box">
      <div class="gloss-handle"></div>
      <div class="ready-hdr"><span class="ready-htitle">&#127919; Relat\u00f3rio de Prontid\u00e3o</span><button class="gloss-close" id="ready-close">&#x2715;</button></div>
      <div class="ready-body"><div class="ready-no-data">&#128269; Nenhum simulado completo ainda.<br>Conclua ao menos uma vez o<br><strong>Modo Livre</strong> ou <strong>Contra-Rel\u00f3gio</strong><br>para gerar seu relat\u00f3rio.</div></div>
    </div>`;
    document.body.appendChild(el);
    el.addEventListener('click',e=>{if(e.target===el)el.remove();});
    document.getElementById('ready-close').addEventListener('click',()=>el.remove());
    return;
  }

  // Readiness ponderado (sessões recentes valem mais)
  let wSum=0,wTot=0;
  relevant.forEach((h,i)=>{const w=Math.max(0.3,1-i*0.1);wSum+=h.pct*w;wTot+=w;});
  const overall=Math.round(wSum/wTot);

  // Estatísticas cumulativas por tópico (Livre + Contra-Relógio)
  const cumTopics={};
  relevant.forEach(h=>{
    if(h.topicStats)Object.entries(h.topicStats).forEach(([tp,{c,t}])=>{
      if(!cumTopics[tp])cumTopics[tp]={c:0,t:0};
      cumTopics[tp].c+=c;cumTopics[tp].t+=t;
    });
  });

  const topicList=Object.entries(cumTopics)
    .filter(([,{t}])=>t>=2)
    .map(([tp,{c,t}])=>({tp,pct:Math.round(c/t*100),t}))
    .sort((a,b)=>b.pct-a.pct);

  const strengths=topicList.filter(x=>x.pct>=75);
  const mid=topicList.filter(x=>x.pct>=60&&x.pct<75);
  const weak=topicList.filter(x=>x.pct<60).sort((a,b)=>a.pct-b.pct);

  const rColor=overall>=80?'#5EE0A8':overall>=65?'#F5C842':'#E05555';
  const rMsg=overall>=80?'Excelente prepara\u00e7\u00e3o! \ud83d\ude80':overall>=65?'Bom progresso \u2014 foque nas lacunas! \ud83d\udcaa':'Continue praticando \u2014 voc\u00ea consegue! \ud83c\udfaf';

  function tpRows(list){
    return list.map(x=>{
      const col=x.pct>=75?'#1D9E75':x.pct>=60?'#BA7517':'#A32D2D';
      return`<div class="ready-topic-row">
        <span class="ready-tp-name">${x.tp}</span>
        <div class="ready-tp-bar"><div class="ready-tp-fill" style="width:${x.pct}%;background:${col}"></div></div>
        <span class="ready-tp-pct" style="color:${col}">${x.pct}%</span>
      </div>`;
    }).join('');
  }

  const statsHtml=topicList.length?`
    ${strengths.length?`<div class="ready-section">
      <div class="ready-stitle"><span style="color:#5EE0A8">&#9989;</span> Pontos Fortes</div>
      ${tpRows(strengths)}</div>`:''}
    ${mid.length?`<div class="ready-section">
      <div class="ready-stitle"><span style="color:#F5C842">&#9889;</span> Em Desenvolvimento</div>
      ${tpRows(mid)}</div>`:''}
    ${weak.length?`<div class="ready-section">
      <div class="ready-stitle"><span style="color:#E05555">&#127919;</span> Foque Aqui</div>
      ${tpRows(weak)}</div>`:''}
  `:`<div style="font-size:12px;color:var(--text2);text-align:center;padding:12px">Dados insuficientes por t\u00f3pico ainda.</div>`;

  // Plano de estudo baseado na data do exame
  let planHtml='';
  const dStr=getExamDate();
  if(weak.length){
    if(dStr){
      const today=new Date();today.setHours(0,0,0,0);
      const exam=new Date(dStr+'T00:00:00');
      const daysLeft=Math.max(0,Math.round((exam-today)/(1000*60*60*24)));
      if(daysLeft>0){
        const dayLabels=['Hoje','Amanh\u00e3'];
        const actions=['Revisar teoria e conceitos','Praticar questões no simulador','Analisar erros cometidos','Refazer questões da categoria','Revisão geral do tópico'];
        const days=Math.min(daysLeft,7);
        const rows=Array.from({length:days},(_,i)=>{
          const topic=weak[i%weak.length];
          const label=i<2?dayLabels[i]:`Dia +${i}`;
          const action=actions[i%actions.length];
          return`<div class="ready-plan-row">
            <span class="ready-day-badge">${label}</span>
            <div><div class="ready-plan-topic">${topic.tp} &mdash; ${topic.pct}%</div><div class="ready-plan-action">${action}</div></div>
          </div>`;
        }).join('');
        planHtml=`<div class="ready-section">
          <div class="ready-stitle">&#128197; Plano de Estudo (${daysLeft} dia${daysLeft!==1?'s':''} at\u00e9 o exame)</div>
          ${rows}</div>`;
      } else {
        planHtml=`<div class="ready-section" style="text-align:center;padding:12px 14px">
          <div style="font-size:12px;color:var(--yellow-text)">&#9888;&#65039; O exame est\u00e1 muito pr\u00f3ximo! Revise os t\u00f3picos fracos agora.</div>
        </div>`;
      }
    } else {
      planHtml=`<div class="ready-section" style="text-align:center;padding:12px 14px">
        <div style="font-size:12px;color:var(--text2)">&#128197; Defina a data do exame na tela inicial para gerar um plano de estudo personalizado.</div>
      </div>`;
    }
  }

  el.innerHTML=`<div class="ready-box">
    <div class="gloss-handle"></div>
    <div class="ready-hdr">
      <span class="ready-htitle">&#127919; Relat\u00f3rio de Prontid\u00e3o</span>
      <button class="gloss-close" id="ready-close">&#x2715;</button>
    </div>
    <div class="ready-body">
      <div class="ready-score">
        <div class="ready-pct" style="color:${rColor}">${overall}%</div>
        <div class="ready-label">Índice de Prontidão &mdash; ${relevant.length} sess\u00e3o${relevant.length!==1?'es':''} analisada${relevant.length!==1?'s':''}</div>
        <div class="ready-msg">${rMsg}</div>
      </div>
      ${statsHtml}
      ${planHtml}
    </div>
  </div>`;

  document.body.appendChild(el);
  el.addEventListener('click',e=>{if(e.target===el)el.remove();});
  document.getElementById('ready-close').addEventListener('click',()=>el.remove());
}

function renderTopicStats(){
  const topics=Object.keys(S.topicStats);
  if(!topics.length)return'';
  const tc={"VLANs":"#1D9E75","Trunking":"#534AB7","Inter-VLAN":"#D85A30","STP":"#185FA5","EtherChannel":"#639922","DHCPv4":"#BA7517","DHCPv6":"#854F0B","FHRP":"#993556","Segurança L2":"#A32D2D","WLAN":"#1D9E75","Roteamento":"#D85A30","Switching":"#185FA5","Troubleshooting":"#993556"};
  const sorted=[...topics].sort((a,b)=>{const pa=S.topicStats[a].t>0?S.topicStats[a].c/S.topicStats[a].t:0,pb=S.topicStats[b].t>0?S.topicStats[b].c/S.topicStats[b].t:0;return pb-pa;});
  const rows=sorted.map(t=>{
    const {c,t:tot}=S.topicStats[t];
    const p=tot>0?Math.round(c/tot*100):0;
    const bar=p>=80?'#1D9E75':p>=60?'#BA7517':'#A32D2D';
    return`<div class="topic-row"><div class="topic-name" title="${t}">${t}</div><div class="topic-bar-wrap"><div class="topic-bar-fill" style="width:${p}%;background:${bar}"></div></div><div class="topic-pct">${p}%</div></div>`;
  }).join('');
  return`<div class="topic-stats-wrap"><p class="sec-hdr">📈 Desempenho por tema</p>${rows}</div>`;
}

async function loadReviewItem(){
  const item=S.wrongLog[S.reviewIdx];
  if(!item)return;
  const body=document.getElementById('review-body');
  if(!body)return;
  body.innerHTML=renderReviewItem();
  bindReviewBody();
  if(!S.reviewAiText&&!S.reviewAiLoading){
    S.reviewAiLoading=true;
    body.innerHTML=renderReviewItem();bindReviewBody();
    S.reviewAiText=await getAI(item.q,false);
    S.reviewAiLoading=false;
    body.innerHTML=renderReviewItem();bindReviewBody();
  }
}

function bindReviewBody(){
  document.querySelectorAll('.fav-btn[data-id]').forEach(b=>b.addEventListener('click',()=>{toggleFav(parseInt(b.dataset.id));}));

}

    <span class="qtag" style="background:${tb};color:${tc};border:.5px solid ${tc}33">${q.tp}</span>
    ${q.code?`<div class="qcode">${esc(q.code)}</div>`:''}
    ${q.fig?`<div class="qfig">${q.fig}</div>`:''}
    <p class="qtext" style="margin-top:${(q.code||q.fig)?'10px':'0'}">${q.text}</p>
  </div>
  ${body}${renderFeedback(q)}${renderAI()}${nextBtn}`;
}

function renderSingle(q){
  const letters=['A','B','C','D','E'];
  // Shuffle options on first render of this question
  if(!S.optOrder){
    const idx=[...Array(q.opts.length).keys()];
    S.optOrder=shuffle(idx);
  }
  const order=S.optOrder;
  return`<div class="opts">${order.map((origI,displayI)=>{
    const o=q.opts[origI];
    let cls='opt';
    if(S.answered){
      if(origI===q.cor)cls+=' correct';
      else if(origI===S.selected&&origI!==q.cor)cls+=' wrong';
      else cls+=' dim';
    }
    return`<button class="${cls}" data-i="${origI}" ${S.answered?'disabled':''}><span class="olet">${letters[displayI]}</span><span>${o.replace(/\n/g,'<br>')}</span></button>`;
  }).join('')}</div>`;
}

function renderMulti(q){
  const letters=['A','B','C','D','E','F'];
  if(!S.optOrder){const idx=[...Array(q.opts.length).keys()];S.optOrder=shuffle(idx);}
  const order=S.optOrder;
  const selSet=new Set(S.multiSel);const corSet=new Set(q.cor);
  const remaining=q.cor.length-S.multiSel.length;
  const neededN=q.cor.length>=4?3:q.cor.length===3?2:q.cor.length;
  const thresholdNote=neededN<q.cor.length?` (acerte ${neededN} de ${q.cor.length} para passar)`:'';
  return`<p class="multi-note">✦ Selecione exatamente <strong style="color:var(--text)">${q.cor.length}</strong> alternativas${thresholdNote}.${!S.answered&&remaining>0?' Faltam <strong style="color:var(--yellow-text)">'+remaining+'</strong>.':!S.answered?' Limite atingido — confirme ou desmarque.':''}</p>
  <div class="opts">${order.map((origI,displayI)=>{
    const o=q.opts[origI];let cls='opt';const isSel=selSet.has(origI);const lim=S.multiSel.length>=q.cor.length&&!isSel;
    if(S.answered){if(corSet.has(origI))cls+=' correct';else if(isSel&&!corSet.has(origI))cls+=' wrong';else cls+=' dim';}
    else if(isSel)cls+=' sel';else if(lim)cls+=' dim';
    return`<button class="${cls}" data-i="${origI}" ${S.answered||(!isSel&&lim)?'disabled':''}><span class="olet">${letters[displayI]}</span><span>${o}</span></button>`;
  }).join('')}</div>
  ${!S.answered&&S.multiSel.length>0?`<button class="btn blue" id="confirmMulti" style="width:100%;padding:11px;margin-bottom:8px">Confirmar (${S.multiSel.length}/${q.cor.length})</button>`:''}`;
}

function renderMatch(q){
  if(!S.shuffledMatchOpts||!S.shuffledMatchOpts.length)S.shuffledMatchOpts=shuffle(q.pairs.map(p=>p.r));
  const opts=S.shuffledMatchOpts;
  const LETTERS=['A','B','C','D','E','F'];
  const MC_COLORS=['#4fc3f7','#81c784','#ffb74d','#e57373','#ba68c8','#4db6ac'];
  const revConns={};
  Object.entries(S.matchSel).forEach(([pi,oi])=>revConns[Number(oi)]=Number(pi));
  const allSelected=q.pairs.every((_,i)=>S.matchSel[i]!==undefined);
  const pend=S.matchPending;

  // ── Left column (stems) ──
  const leftRows=q.pairs.map((p,pi)=>{
    const isConn=S.matchSel[pi]!==undefined;
    const isPend=pend===pi;
    const oi=S.matchSel[pi];
    let dotBorder,dotBg;
    if(S.answered&&isConn){
      const ok=opts[oi]===p.r;
      dotBorder=ok?'#81c784':'#e57373'; dotBg=ok?'#81c784':'#e57373';
    } else if(isConn){
      dotBorder=MC_COLORS[pi%MC_COLORS.length]; dotBg=MC_COLORS[pi%MC_COLORS.length];
    } else if(isPend){
      dotBorder='#ffffff'; dotBg='rgba(255,255,255,.18)';
    } else {
      dotBorder='var(--border2)'; dotBg='transparent';
    }
    return`<div class="mc-left-item">
      <span class="mc-ltext">${p.l}</span>
      <div class="mc-ldot${isPend?' mc-pend':''}" data-pi="${pi}" id="mc-l-${pi}"
           style="border-color:${dotBorder};background:${dotBg}"></div>
    </div>`;
  }).join('');

  // ── Right column (options) ──
  const rightRows=opts.map((opt,oi)=>{
    const isConn=revConns[oi]!==undefined;
    const pi=revConns[oi];
    let dotBorder,dotBg,dotColor;
    if(S.answered&&isConn){
      const ok=opts[oi]===q.pairs[pi].r;
      dotBorder=ok?'#81c784':'#e57373'; dotBg=ok?'#81c784':'#e57373'; dotColor='#fff';
    } else if(isConn){
      dotBorder=MC_COLORS[pi%MC_COLORS.length]; dotBg=MC_COLORS[pi%MC_COLORS.length]; dotColor='#fff';
    } else {
      dotBorder='var(--border2)'; dotBg='transparent'; dotColor='var(--sub)';
    }
    return`<div class="mc-right-item">
      <div class="mc-rdot${S.answered?' mc-disabled':''}" data-oi="${oi}" id="mc-r-${oi}"
           style="border-color:${dotBorder};background:${dotBg};color:${dotColor}">
        ${LETTERS[oi]}
      </div>
      <span class="mc-rtext">${opt}</span>
    </div>`;
  }).join('');

  const confirmBtn=!S.answered&&allSelected
    ?`<button class="btn blue" id="confirmMatch" style="width:100%;padding:12px;font-size:14px;margin-top:4px">✓ Confirmar Correspondência</button>`:'';
  const hint=!S.answered
    ?`<p class="multi-note" style="margin-top:6px">✦ Clique no círculo à esquerda, depois no círculo à direita para ligar.</p>`:'';

  return`<div class="mc-wrap" id="mc-wrap">
    <svg id="mc-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2"></svg>
    <div class="mc-cols">
      <div class="mc-left-col">${leftRows}</div>
      <div class="mc-right-col">${rightRows}</div>
    </div>
  </div>
  ${confirmBtn}${hint}`;
}

function updateMatchLines(){
  const svg=document.getElementById('mc-svg');
  if(!svg)return;
  const wrap=document.getElementById('mc-wrap');
  if(!wrap)return;
  const q=Q[S.order[S.qi]];
  if(!q||q.ty!=='match')return;
  const opts=S.shuffledMatchOpts||[];
  const MC_COLORS=['#4fc3f7','#81c784','#ffb74d','#e57373','#ba68c8','#4db6ac'];
  svg.innerHTML='';
  const wr=wrap.getBoundingClientRect();
  Object.entries(S.matchSel).forEach(([piStr,oi])=>{
    const pi=parseInt(piStr);
    const ld=document.getElementById(`mc-l-${pi}`);
    const rd=document.getElementById(`mc-r-${oi}`);
    if(!ld||!rd)return;
    const lr=ld.getBoundingClientRect();
    const rr=rd.getBoundingClientRect();
    const x1=lr.left+lr.width/2-wr.left;
    const y1=lr.top+lr.height/2-wr.top;
    const x2=rr.left+rr.width/2-wr.left;
    const y2=rr.top+rr.height/2-wr.top;
    let color=MC_COLORS[pi%MC_COLORS.length];
    if(S.answered){
      const pair=q.pairs[pi];
      color=opts[oi]===pair.r?'#81c784':'#e57373';
    }
    const cx=(x1+x2)/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${x1} ${y1} C ${cx} ${y1} ${cx} ${y2} ${x2} ${y2}`);
    path.setAttribute('stroke',color);
    path.setAttribute('stroke-width','2.5');
    path.setAttribute('fill','none');
    path.setAttribute('stroke-linecap','round');
    path.setAttribute('opacity','0.85');
    svg.appendChild(path);
  });
}

function renderFeedback(q){
  if(!S.answered)return'';
  const LETTERS=['A','B','C','D','E','F'];
  // Map original index → display letter (accounts for shuffle)
  function origToLetter(origIdx){
    if(S.optOrder){
      const displayPos=S.optOrder.indexOf(origIdx);
      return LETTERS[displayPos>=0?displayPos:origIdx];
    }
    return LETTERS[origIdx];
  }
  let isOk=false,isPart=false,msg='';
  if(q.ty==='single'){
    isOk=S.selected===q.cor;
    const cL=origToLetter(q.cor);
    msg=isOk
      ?`✓ Correto! +15 XP${S.streak>=3?' 🔥 Streak x3!':S.streak>=2?' 🔥 Streak!':''}`
      :`✗ Incorreto. Resposta correta: <strong>${cL}</strong>`;
  }
  else if(q.ty==='multi'){
    const cS=new Set(q.cor);const sS=new Set(S.multiSel);
    const needed=q.cor.length>=4?3:q.cor.length===3?2:q.cor.length;
    const hits=[...sS].filter(s=>cS.has(s)).length;
    isOk=hits>=needed;
    const threshold=`${needed}/${q.cor.length}`;
    if(isOk)msg=`✓ Correto! (${hits}/${q.cor.length}) +20 XP${S.streak>=2?' 🔥':''}`;
    else{
      const sorted=[...q.cor].sort((a,b)=>{
        const pa=S.optOrder?S.optOrder.indexOf(a):a;
        const pb=S.optOrder?S.optOrder.indexOf(b):b;
        return pa-pb;
      });
      msg=`✗ Incorreto (${hits}/${q.cor.length} — precisava de ${threshold}). Corretas: ${sorted.map(c=>origToLetter(c)).join(', ')}.`;
    }
  }
  else{
    const allOk=q.pairs.every((p,pi)=>S.shuffledMatchOpts[S.matchSel[pi]]===p.r);
    const someOk=q.pairs.some((p,pi)=>S.shuffledMatchOpts[S.matchSel[pi]]===p.r);
    isOk=allOk;isPart=!allOk&&someOk;
    if(isOk)msg=`✓ Todas corretas! +20 XP${S.streak>=2?' 🔥':''}`;
    else if(isPart)msg=`⚡ Parcialmente correto. +5 XP`;
    else msg=`✗ Incorreto. Veja as marcações verdes.`;
  }
  return`<div class="fb ${isOk?'ok':isPart?'part':'ng'}"><div class="fb-title">${msg}</div></div>`;
}

function renderAI(){
  if(!S.answered)return'';
  if(S.aiLoading)return`<div class="ai-box"><div class="ai-head"><div class="ai-dot"></div><span>Claude está explicando...</span></div><div class="ai-text" style="color:var(--text3)">Carregando...</div></div>`;
  if(!S.aiText)return'';
  return`<div class="ai-box"><div class="ai-head"><span style="color:var(--green)">🤖</span> <span class="ai-label">${Q[S.order[S.qi]].sub}</span></div><div class="ai-text">${S.aiText}</div></div>`;
}

function trackTopic(q,ok){
  if(!S.topicStats[q.tp])S.topicStats[q.tp]={c:0,t:0};
  S.topicStats[q.tp].t++;
  if(ok)S.topicStats[q.tp].c++;
}
function trackWrong(q){
  S.wrongLog.push({q,selected:S.selected,multiSel:[...S.multiSel],matchSel:{...S.matchSel},shuffledMatchOpts:[...(S.shuffledMatchOpts||[])]});
}

async function getAI(q,isOk){
  const ctx=isOk?`Explique em 2-3 frases didáticas o conceito de CCNA2 SRWE sobre: "${q.sub}". Seja técnico e conciso. Responda em português.`:`O estudante errou. Conceito correto: "${q.why}". Reforce em 2-3 frases o porquê da resposta correta em "${q.sub}". Seja encorajador. Responda em português.`;
  try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:200,messages:[{role:"user",content:ctx}]})});if(!r.ok)return q.why;const d=await r.json();return d.content?.[0]?.text||q.why;}catch{return q.why;}
}

function showLimitWarning(){
  const maxErr=S.maxLives;
  const old=document.getElementById('limitOverlay');if(old)old.remove();
  const overlay=document.createElement('div');overlay.className='limit-overlay';overlay.id='limitOverlay';
  overlay.innerHTML=`<div class="limit-box">
    <div class="limit-icon">⚠️</div>
    <div class="limit-title">Limite de Erros Atingido</div>
    <div class="limit-msg">Você errou <strong>${S.wrong}</strong> questões (limite: ${maxErr}).<br>Deseja continuar mesmo assim ou reiniciar?</div>
    <div class="limit-btns">
      <button class="btn pri" id="limitContinue" style="padding:12px;font-size:14px">Continuar a Prova</button>
      <button class="btn" id="limitRestart" style="padding:11px;font-size:13px;color:var(--red-text);border-color:var(--red)">Reiniciar do Início</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('limitContinue')?.addEventListener('click',()=>{
    S.overLimit=true;S.lives=99999;S.maxLives=99999;
    overlay.remove();render();
  });
  document.getElementById('limitRestart')?.addEventListener('click',()=>{
    overlay.remove();stopTimer();stopQTimer();S.screen='start';render();
  });
}

function startQTimer(){
  stopQTimer();
  S.qSeconds=0;
  qTimerInterval=setInterval(()=>{
    S.qSeconds++;
    const el=document.getElementById('qtimer-display');
    if(el)el.textContent='⏱ '+formatTime(S.qSeconds);
  },1000);
}
function stopQTimer(){if(qTimerInterval){clearInterval(qTimerInterval);qTimerInterval=null;}}

function getSavedProgress(){
  try{const s=localStorage.getItem('ccna2_progress');return s?JSON.parse(s):null;}catch{return null;}
}
function saveProgress(){
  if(S.screen!=='quiz')return;
  const slim={screen:S.screen,order:S.order,qi:S.qi,xp:S.xp,lives:S.lives,maxLives:S.maxLives,streak:S.streak,maxStreak:S.maxStreak,correct:S.correct,wrong:S.wrong,answered:S.answered,selected:S.selected,multiSel:S.multiSel,matchSel:S.matchSel,optOrder:S.optOrder,badges:S.badges,wrongLog:S.wrongLog.map(w=>({q:{id:w.q.id},selected:w.selected,multiSel:w.multiSel,matchSel:w.matchSel})),topicStats:S.topicStats,timerMode:S.timerMode,timerLeft:S.timerLeft,startMode:S.startMode,selectedTopic:S.selectedTopic,qSeconds:S.qSeconds};
  localStorage.setItem('ccna2_progress',JSON.stringify(slim));
}
function clearProgress(){localStorage.removeItem('ccna2_progress');}

function getSmartIds(){
  const hist=JSON.parse(localStorage.getItem('ccna2_history')||'[]');
  const wrongCount={};
  hist.slice(0,15).forEach(h=>{
    (h.wrongIds||[]).forEach(id=>{wrongCount[id]=(wrongCount[id]||0)+1;});
  });
  return Object.keys(wrongCount).filter(id=>wrongCount[id]>=1).sort((a,b)=>wrongCount[b]-wrongCount[a]).map(Number);
}

function resumeGame(){
  const saved=getSavedProgress();if(!saved)return;
  // Rebuild full Q references in wrongLog
  saved.wrongLog=saved.wrongLog.map(w=>({...w,q:Q.find(x=>x.id===w.q.id)||{}})).filter(w=>w.q.id);
  S={...S,...saved,shuffledMatchOpts:[],aiText:'',aiLoading:false,reviewIdx:0,reviewAiText:'',reviewAiLoading:false};
  if(S.timerMode==='timed')startTimer();
  startQTimer();
  render();
}

function startQuiz(){
  stopTimer();stopQTimer();
  const mode=S.startMode||'free';
  let pool;
  if(mode==='favs'){pool=Q.map((_,i)=>i).filter(i=>favorites.has(Q[i].id));}
  else if(mode==='topic'&&S.selectedTopic){pool=Q.map((_,i)=>i).filter(i=>Q[i].tp===S.selectedTopic);}
  else if(mode==='smart'){
    const ids=getSmartIds();
    pool=Q.map((_,i)=>i).filter(i=>ids.includes(Q[i].id));
    if(!pool.length){alert('Nenhum erro registrado ainda. Complete uma prova primeiro!');return;}
  }
  else pool=[...Array(Q.length).keys()];
  if(!pool.length){alert('Nenhuma questão disponível para este modo!');return;}
  const order=shuffle(pool);
  const maxLives=mode==='timed'?Math.max(1,Math.floor(pool.length*0.30)):99999;
  // Check for conflicting saved progress
  const existing=getSavedProgress();
  if(existing){
    const savedMode=existing.startMode||'free';
    const savedTopic=existing.selectedTopic||null;
    const sameSession=(savedMode===mode&&savedTopic===(S.selectedTopic||null));
    if(!sameSession){
      const q=existing;
      const msg=`Você tem um simulado salvo (Questão ${q.qi+1}/${q.order.length}, modo ${savedMode==='timed'?'Contra-Relógio':savedMode==='topic'?'Por Tópico':'Livre'}).\n\nDeseja abandoná-lo e iniciar um novo simulado?`;
      if(!confirm(msg))return;
    }
  }
  histSaved=false;clearProgress();
  S={screen:'quiz',order,qi:0,xp:0,lives:maxLives,maxLives,streak:0,maxStreak:0,correct:0,wrong:0,answered:false,selected:null,multiSel:[],matchSel:{},matchPending:null,shuffledMatchOpts:[],optOrder:null,aiText:'',aiLoading:false,badges:[],wrongLog:[],topicStats:{},timerMode:mode==='timed'?'timed':'free',timerLeft:7200,reviewIdx:0,reviewAiText:'',reviewAiLoading:false,startMode:mode,selectedTopic:S.selectedTopic,qSeconds:0,searchQuery:'',overLimit:false};
  if(S.timerMode==='timed')startTimer();
  startQTimer();
  render();
}

async function handleSingle(i){
  if(S.answered)return;
  stopQTimer();
  const q=Q[S.order[S.qi]];S.selected=i;S.answered=true;
  const ok=i===q.cor;
  if(ok){S.streak++;if(S.streak>S.maxStreak)S.maxStreak=S.streak;S.xp+=15+(S.streak>=3?10:S.streak>=2?5:0);S.correct++;}
  else{if(S.timerMode==='timed'&&!S.overLimit)S.lives--;S.streak=0;S.xp=Math.max(0,S.xp-5);S.wrong++;trackWrong(q);}
  trackTopic(q,ok);updateQStats(q,ok);
  // Flash animation
  const app=document.getElementById('app');
  if(app){app.classList.remove('flash-ok','flash-ng');void app.offsetWidth;app.classList.add(ok?'flash-ok':'flash-ng');}
  S.aiLoading=true;render();saveProgress();
  S.aiText=await getAI(q,ok);S.aiLoading=false;render();
  if(S.timerMode==='timed'&&S.lives<=0&&!S.overLimit){showLimitWarning();}
}

async function handleMatchConfirm(){
  if(S.answered)return;

  const q=Q[S.order[S.qi]];S.answered=true;
  const allOk=q.pairs.every((p,pi)=>S.shuffledMatchOpts[S.matchSel[pi]]===p.r);

  if(allOk){S.streak++;if(S.streak>S.maxStreak)S.maxStreak=S.streak;S.xp+=20+(S.streak>=3?10:S.streak>=2?5:0);S.correct++;}
  else if(someOk){S.streak=0;S.xp+=5;S.wrong++;trackWrong(q);}

function nextQuestion(){
  const timedLivesOut=S.timerMode==='timed'&&S.lives<=0&&!S.overLimit;
  if(S.qi>=S.order.length-1||timedLivesOut){finishQuiz();return;}
  S.qi++;S.answered=false;S.selected=null;S.multiSel=[];S.matchSel={};S.matchPending=null;S.shuffledMatchOpts=[];S.optOrder=null;S.aiText='';S.aiLoading=false;S.qSeconds=0;
  startQTimer();render();saveProgress();
}

function finishQuiz(){
  stopTimer();stopQTimer();clearProgress();
  const tot=S.correct+S.wrong;const pct=tot>0?Math.round(S.correct/tot*100):0;
  S.badges=[];
  if(pct===100)S.badges.push({t:'Perfeito 🏆',bg:'var(--green-bg)',c:'var(--green-text)',bc:'var(--green)'});
  if(S.maxStreak>=5)S.badges.push({t:'Streak Master 🔥',bg:'var(--purple-bg)',c:'var(--purple-text)',bc:'var(--purple)'});
  if(S.lives>0)S.badges.push({t:'Aprovado ✓',bg:'var(--blue-bg)',c:'var(--blue-text)',bc:'var(--blue)'});
  if(S.wrong===0&&pct>0)S.badges.push({t:'Sem Erros 💚',bg:'var(--green-bg)',c:'var(--green-text)',bc:'var(--green)'});
  if(S.xp>=300)S.badges.push({t:'XP Master ⚡',bg:'var(--yellow-bg)',c:'var(--yellow-text)',bc:'var(--yellow)'});
  if(S.timerMode==='timed')S.badges.push({t:'⏱ Contra-relógio',bg:'var(--blue-bg)',c:'var(--blue-text)',bc:'var(--blue)'});
  if(S.overLimit)S.badges.push({t:'⚠️ Limite ultrapassado',bg:'var(--yellow-bg)',c:'var(--yellow-text)',bc:'var(--yellow)'});
  saveHistory();
  // Save to leaderboard if name set and passed
  if(S.lives>0){
    const name=localStorage.getItem('ccna2_studentname');
    if(name)saveToLeaderboard(name,pct,S.xp,S.correct,S.wrong);
  }
  S.screen='result';render();
  if(S.lives>0){
    const certCard=document.getElementById('certCard');
    if(certCard){const color1=pct===100?'#F5C842':pct>=90?'#5EE0A8':pct>=80?'#7AB8F5':'#A89DF5';certCard.style.borderColor=color1+'88';}

}

function startConfetti(){
  const canvas=document.getElementById('confetti-canvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const colors=['#F5C842','#5EE0A8','#7AB8F5','#A89DF5','#F08080','#FFD700','#00E5FF','#FF6EC7'];const pieces=[];
  for(let i=0;i<140;i++)pieces.push({x:Math.random()*canvas.width,y:-20-Math.random()*200,r:Math.random()*7+3,dx:(Math.random()-.5)*3,dy:Math.random()*4+2,rot:Math.random()*360,rotS:(Math.random()-.5)*8,color:colors[Math.floor(Math.random()*colors.length)],shape:Math.random()>.5?'rect':'circle',w:Math.random()*10+5,h:Math.random()*5+3,alpha:1,fade:Math.random()*.003+.002});
  let frame=0;
  function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);pieces.forEach(p=>{ctx.save();ctx.globalAlpha=p.alpha;ctx.fillStyle=p.color;ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);if(p.shape==='rect')ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);else{ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();}ctx.restore();p.x+=p.dx;p.y+=p.dy;p.rot+=p.rotS;if(frame>80)p.alpha=Math.max(0,p.alpha-p.fade);});frame++;if(pieces.some(p=>p.alpha>0))requestAnimationFrame(draw);else ctx.clearRect(0,0,canvas.width,canvas.height);}
  setTimeout(draw,200);
}

function shareResult(){
  const tot=S.correct+S.wrong;
  const pct=tot>0?Math.round(S.correct/tot*100):0;
  const name=localStorage.getItem('ccna2_studentname')||'';
  // Try to generate image from certCard
  const certCard=document.getElementById('certCard');
  if(certCard&&window.html2canvas){
    window.html2canvas(certCard,{backgroundColor:null,scale:2}).then(canvas=>{
      canvas.toBlob(blob=>{
        if(navigator.share&&blob){
          const file=new File([blob],'certificado_ccna2.png',{type:'image/png'});
          navigator.share({title:'Certificado CCNA2 SRWE',files:[file]}).catch(()=>downloadCanvas(canvas));
        } else {downloadCanvas(canvas);}
      });
    });
    return;
  }
  // Fallback text
  const emoji=pct>=90?'🏆':pct>=70?'✅':'📚';
  const text=`${emoji} CCNA2 v7 SRWE — Simulado${name?' — '+name:''}\n✓ ${S.correct} acertos · ✗ ${S.wrong} erros · ${pct}%\n🔥 Streak máx: ${S.maxStreak} · ⚡ ${S.xp} XP\n${S.lives>0?'🎓 APROVADO!':'📖 Continue estudando!'}`;
  if(navigator.share)navigator.share({title:'Resultado CCNA2 SRWE',text});
  else navigator.clipboard?.writeText(text).then(()=>alert('Resultado copiado! Cole onde quiser.'));
}

function bindLogin(){
  const first=document.getElementById('loginFirst');
  const last=document.getElementById('loginLast');
  const btn=document.getElementById('loginBtn');
  // Pre-fill if already saved
  const saved=localStorage.getItem('ccna2_studentname')||'';
  if(saved){const parts=saved.split(' ');if(first)first.value=parts[0]||'';if(last)last.value=parts.slice(1).join(' ')||'';}
  function tryLogin(){
    const f=(first?.value||'').trim();const l=(last?.value||'').trim();
    if(!f||!l){first?.focus();return;}
    localStorage.setItem('ccna2_studentname',(f+' '+l).trim());
    S.screen='course';render();
  }
  btn?.addEventListener('click',tryLogin);
  [first,last].forEach(inp=>{inp?.addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});});
  document.getElementById('themeToggle')?.addEventListener('click',toggleDark);
}

  // Search input (live)
  const si=document.getElementById('searchInput');
  if(si){
    si.focus();
    si.addEventListener('input',()=>{
      S.searchQuery=si.value;
      const res=document.getElementById('search-results');
      if(!res)return;
      const q=S.searchQuery;
      const results=q.trim().length>=2?Q.filter(x=>{
        const hay=(x.text+' '+(x.opts||[]).join(' ')+' '+x.sub+' '+x.tp).toLowerCase();
        return q.toLowerCase().split(' ').every(w=>hay.includes(w));
      }):[];
      const tagColors={"VLANs":"#1D9E75","Trunking":"#534AB7","Inter-VLAN":"#D85A30","STP":"#185FA5","EtherChannel":"#639922","DHCPv4":"#BA7517","DHCPv6":"#854F0B","FHRP":"#993556","Segurança L2":"#A32D2D","WLAN":"#1D9E75","Roteamento":"#D85A30","Switching":"#185FA5","Troubleshooting":"#993556"};
      const tagBgs={"VLANs":"#0D3D2E","Trunking":"#1E1A3D","Inter-VLAN":"#3D1808","STP":"#0D2A4A","EtherChannel":"#1A3006","DHCPv4":"#3D2A06","DHCPv6":"#3D2206","FHRP":"#3D1220","Segurança L2":"#3D0D0D","WLAN":"#0D3D2E","Roteamento":"#3D1808","Switching":"#0D2A4A","Troubleshooting":"#3D1220"};
      if(q.trim().length<2){res.innerHTML=`<div style="text-align:center;padding:30px 0;color:var(--text3);font-size:13px">Digite pelo menos 2 caracteres</div>`;return;}
      if(!results.length){res.innerHTML=`<div style="text-align:center;padding:30px 0;color:var(--text3);font-size:13px">Nenhuma questão encontrada</div>`;return;}
      res.innerHTML=`<div style="font-size:11px;color:var(--text3);margin-bottom:8px">${results.length} resultado${results.length>1?'s':''}</div>`+

        }).join('');

      res.querySelectorAll('.search-item[data-sid]').forEach(el=>{
        el.addEventListener('click',()=>{S.searchDetailId=parseInt(el.dataset.sid);S.screen='search-detail';render();});
      });
    });
  }
  // Search result clicks (initial render)
  document.querySelectorAll('.search-item[data-sid]').forEach(el=>{
    el.addEventListener('click',()=>{S.searchDetailId=parseInt(el.dataset.sid);S.screen='search-detail';render();});
  });
  // Fav buttons
  document.querySelectorAll('.fav-btn[data-id]').forEach(b=>b.addEventListener('click',()=>{toggleFav(parseInt(b.dataset.id));render();}));

  document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(S.answered)return;
    const i=parseInt(b.dataset.i);const q=Q[S.order[S.qi]];
    if(q.ty==='single')handleSingle(i);
    else if(q.ty==='multi'){const idx=S.multiSel.indexOf(i);if(idx>=0)S.multiSel.splice(idx,1);else if(S.multiSel.length<q.cor.length)S.multiSel.push(i);render();}
  }));
  // Match dot interactions
  document.querySelectorAll('.mc-ldot').forEach(dot=>dot.addEventListener('click',()=>{
    if(S.answered)return;
    const pi=parseInt(dot.dataset.pi);
    S.matchPending=(S.matchPending===pi)?null:pi;
    render();
    requestAnimationFrame(updateMatchLines);
  }));
  document.querySelectorAll('.mc-rdot').forEach(dot=>dot.addEventListener('click',()=>{
    if(S.answered)return;
    if(S.matchPending===null||S.matchPending===undefined)return;
    const oi=parseInt(dot.dataset.oi);
    const pi=S.matchPending;
    // Remove any previous connection to this oi from another pi
    Object.keys(S.matchSel).forEach(k=>{if(parseInt(k)!==pi&&S.matchSel[k]===oi)delete S.matchSel[k];});
    // Toggle: if same connection already exists, remove it; else set it
    if(S.matchSel[pi]===oi){delete S.matchSel[pi];}else{S.matchSel[pi]=oi;}
    S.matchPending=null;
    render();
    requestAnimationFrame(updateMatchLines);
  }));
  bindAcronymTouch();
  // Draw lines after render
  requestAnimationFrame(updateMatchLines);
}

  'RADIUS':'Remote Authentication Dial-In User Service — Servidor de autenticação centralizada (AAA)',
  'EAP':'Extensible Authentication Protocol — Protocolo extensível de autenticação (usado no 802.1X)',
  'AP':'Access Point — Ponto de Acesso sem fio (dispositivo WiFi que conecta clientes à rede)',
  'SSID':'Service Set Identifier — Nome da rede WiFi transmitido pelo Access Point',
  'WLC':'Wireless LAN Controller — Controlador central que gerencia múltiplos APs',
  'WPA':'Wi-Fi Protected Access — Protocolo de segurança WiFi v1 (usa TKIP, mais fraco)',
  'WEP':'Wired Equivalent Privacy — Protocolo de segurança WiFi obsoleto e facilmente quebrado',
  'AES':'Advanced Encryption Standard — Criptografia simétrica forte (128/256 bits), usada no WPA2',
  'TKIP':'Temporal Key Integrity Protocol — Criptografia do WPA (mais fraca que AES/CCMP)',
  'CCMP':'Counter Mode CBC-MAC Protocol — Modo de criptografia do WPA2 baseado em AES',
  'PSK':'Pre-Shared Key — Chave Pré-Compartilhada (senha WiFi no modo Personal/doméstico)',
  'OSPF':'Open Shortest Path First — Protocolo de roteamento dinâmico de estado de link (padrão aberto)',
  'EIGRP':'Enhanced Interior Gateway Routing Protocol — Protocolo de roteamento híbrido proprietário Cisco',
  'RIP':'Routing Information Protocol — Protocolo de roteamento por vetor de distância (simples, legado)',
  'BGP':'Border Gateway Protocol — Protocolo de roteamento entre sistemas autônomos (Internet)',
  'AD':'Administrative Distance — Distância Administrativa (valor de confiabilidade da fonte de rota)',
  'SLAAC':'Stateless Address Autoconfiguration — Autoconfiguração de endereço IPv6 sem servidor DHCP',
  'RA':'Router Advertisement — Anúncio do Roteador (mensagem ICMPv6 com prefixo e flags M/O)',
  'RS':'Router Solicitation — Solicitação de Roteador (host pede RA ao roteador via ICMPv6)',
  'NMS':'Network Management System — Sistema de Gerenciamento de Rede (recebe traps SNMP)',
  'MIB':'Management Information Base — Base de dados de variáveis gerenciáveis pelo SNMP',
  'VTY':'Virtual Terminal Lines — Linhas virtuais de terminal para acesso remoto SSH/Telnet no IOS',
  'IEEE':'Institute of Electrical and Electronics Engineers — Organização que define padrões de rede',
  'VoIP':'Voice over IP — Voz sobre IP (telefonia transmitida pela rede de dados)',
  'DORA':'Discover, Offer, Request, Acknowledge — As 4 mensagens do processo DHCP',
  'NAK':'Negative Acknowledgment — Resposta negativa do DHCP (rejeita renovação de endereço)',
};

const _acrKeys=Object.keys(ACRONYMS).sort((a,b)=>b.length-a.length);
const _acrPattern=new RegExp('(?<![\\w/])(' + _acrKeys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')(?![\\w/])','g');

function wrapAcronyms(text){
  if(!text||typeof text!=='string')return text;
  return text.replace(_acrPattern,(match)=>{
    const def=ACRONYMS[match];
    if(!def)return match;
    return `<span class="acr" data-def="${def.replace(/"/g,'&quot;')}">${match}</span>`;
  });
}

// Aplica wrapAcronyms nos elementos da questão após render
function applyAcronymsToPage(){
  // Aplica em texto da questão e opções — não em código (qcode)
  document.querySelectorAll('.qtext, .opt span:last-child, .match-cat, .ai-text, .fb-title, .cert-sub').forEach(el=>{
    if(el.closest('.qcode'))return; // nunca dentro de blocos de código
    if(el.querySelector('.acr'))return; // já processado
    el.innerHTML=wrapAcronyms(el.innerHTML);
  });
  bindAcronymTouch();
}

// ── Tooltip global (evita sair da tela no mobile) ──
let _tipEl=null;
function _getTip(){
  if(!_tipEl){
    _tipEl=document.createElement('div');
    _tipEl.id='acr-tip-global';
    Object.assign(_tipEl.style,{
      position:'fixed',background:'#1A2540',color:'#E8F0FF',
      border:'1px solid #334477',borderRadius:'8px',padding:'7px 12px',
      fontSize:'11.5px',fontWeight:'500',lineHeight:'1.5',
      maxWidth:'min(270px,calc(100vw - 24px))',whiteSpace:'normal',
      boxShadow:'0 4px 16px rgba(0,0,0,.45)',zIndex:'9999',
      pointerEvents:'none',opacity:'0',transition:'opacity .15s',
      textAlign:'left',minWidth:'140px',display:'none'
    });
    document.body.appendChild(_tipEl);
  }
  return _tipEl;
}
function _showTip(el){
  const tip=_getTip();
  tip.textContent=el.dataset.def||'';
  // theme colors
  const light=document.documentElement.dataset.theme==='light';
  tip.style.background=light?'#1E2D5A':'#1A2540';
  tip.style.color=light?'#EEF2FF':'#E8F0FF';
  tip.style.borderColor=light?'#3B5499':'#334477';
  tip.style.opacity='0';
  tip.style.display='block';
  // aguarda o browser renderizar para ler dimensões corretas
  requestAnimationFrame(()=>{
    const r=el.getBoundingClientRect();
    const tw=tip.offsetWidth, th=tip.offsetHeight;
    let x=r.left+r.width/2-tw/2;
    let y=r.top-th-9;
    const margin=8;
    x=Math.max(margin,Math.min(x,window.innerWidth-tw-margin));
    if(y<margin){ y=r.bottom+9; }
    tip.style.left=x+'px';
    tip.style.top=y+'px';
    tip.style.opacity='1';
  });
}
function _hideTip(){
  if(_tipEl){_tipEl.style.opacity='0';setTimeout(()=>{if(_tipEl)_tipEl.style.display='none';},150);}
}

function bindAcronymTouch(){
  const isTouchDevice=()=>window.matchMedia('(hover:none)').matches;
  document.querySelectorAll('.acr').forEach(el=>{
    if(el.dataset.bound)return;
    el.dataset.bound='1';
    // clique: abre/fecha — funciona em mobile E desktop
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const isOpen=el.classList.contains('tip-open');
      // fecha qualquer outro aberto
      document.querySelectorAll('.acr.tip-open').forEach(x=>x.classList.remove('tip-open'));
      _hideTip();
      if(!isOpen){
        el.classList.add('tip-open');
        _showTip(el);
      }
    });
    // hover só em dispositivos com mouse real (não touch)
    el.addEventListener('mouseenter',()=>{
      if(!isTouchDevice())_showTip(el);
    });
    el.addEventListener('mouseleave',()=>{
      if(!isTouchDevice()){
        // só fecha no hover se não estiver fixado por clique
        if(!el.classList.contains('tip-open'))_hideTip();
      }
    });
  });
  // clicar fora fecha o tooltip
  document.addEventListener('click',()=>{
    document.querySelectorAll('.acr.tip-open').forEach(x=>x.classList.remove('tip-open'));
    _hideTip();
  });
}

// Intercepta render para aplicar siglas depois
render();
requestAnimationFrame(applyAcronymsToPage);
</script>
