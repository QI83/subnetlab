<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SubnetLab — Biblioteca (protótipo para avaliação)</title>
<meta name="theme-color" content="#0F1117">
<style>
  :root{
    --bg:#0F1117; --bg2:#12172B; --bg3:#1A1D2F; --border:#232841; --border2:#2E3550;
    --text:#E8EAF6; --text2:#A8AFC7; --text3:#8A93AE;
    --green:#2ECC8F; --green-text:#5EE0A8; --green-bg:#0E2A22; --green-line:#1E5A47;
    --blue-text:#7AB8F5; --blue-bg:#12203A; --blue-line:#24406B;
    --yellow:#F5C842; --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
    --radius:13px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 0 6px;position:sticky;top:0;background:var(--bg);z-index:5}
  .topbar h1{font-size:15px;font-weight:800;letter-spacing:.01em}
  .back{width:38px;height:38px;border-radius:50%;border:1px solid var(--border2);background:transparent;color:var(--text2);
        display:grid;place-items:center;font-size:16px;cursor:pointer}
  .back:focus-visible,.btn:focus-visible,.reveal:focus-visible,.opt-row:focus-visible{outline:2px solid #3B82F6;outline-offset:2px}
  .prog{margin-left:auto;font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
  .lead{font-size:12.5px;color:var(--text3);line-height:1.5;margin:2px 0 14px}
  .lead b{color:var(--text2)}

  /* recomendação */
  .reco{border:1px solid var(--green-line);background:linear-gradient(160deg,#0E2A22,#0F1D1A);border-radius:16px;padding:15px}
  .kicker{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.08em;
          text-transform:uppercase;color:var(--green-text)}
  .reco h2{font-size:17px;font-weight:700;margin:8px 0 5px;line-height:1.25}
  .reco p{font-size:12.5px;color:var(--text2);line-height:1.5}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px}
  .pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:#123528;color:var(--green-text);
        border:.5px solid var(--green-line)}
  .cta{background:var(--green);color:#04150F;font:800 13px/1 inherit;padding:11px 16px;border:none;border-radius:11px;cursor:pointer}

  .sec{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin:20px 0 10px}
  .list{display:flex;flex-direction:column;gap:8px}
  .tcard{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--bg2);
         border:1px solid var(--border);border-radius:var(--radius);padding:12px 13px;color:inherit;font:inherit;cursor:pointer}
  .tcard:hover{border-color:var(--border2)}
  .bar{width:3px;height:32px;border-radius:3px;flex:0 0 auto}
  .info{flex:1;min-width:0}
  .nm{font-size:13.5px;font-weight:700}
  .meta{font-size:11px;color:var(--text3);margin-top:2px}
  .ring{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;flex:0 0 auto}

  /* cartão */
  .tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
       padding:4px 10px;border-radius:20px;background:#2C1A1422;border:.5px solid #D85A3066;border-left:3px solid #D85A30}
  .ctitle{font-size:23px;font-weight:800;line-height:1.22;margin:12px 0 10px;letter-spacing:-.01em}
  .hook{font-size:14px;line-height:1.5;color:var(--green-text);border-left:2px solid var(--green-line);padding-left:12px;margin-bottom:18px}
  .blk{margin-bottom:16px}
  .lbl{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
  .blk p{font-size:14px;line-height:1.6;color:var(--text2)}
  .blk p b{color:var(--text)}
  .bullets{list-style:none;display:flex;flex-direction:column;gap:8px}
  .bullets li{font-size:13.5px;line-height:1.5;color:var(--text2);padding-left:17px;position:relative}
  .bullets li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--yellow)}
  .bullets li b{color:var(--text)}
  .cmd{background:#0B0F18;border:1px solid var(--border);border-radius:11px;padding:12px 14px;font-family:var(--mono);
       font-size:12.5px;line-height:1.7;color:#9FE8C4;overflow-x:auto;white-space:pre}
  .cmd .cm{color:#5C6B8A}

  /* recuperação */
  .quiz{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:8px}
  .q{font-size:13.5px;line-height:1.5}
  .q b{color:var(--green-text);font-weight:700;margin-right:4px}
  .reveal{margin-top:9px;font:700 11.5px/1 inherit;color:var(--blue-text);background:var(--blue-bg);
          border:.5px solid var(--blue-line);padding:7px 11px;border-radius:9px;cursor:pointer}
  .a{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border2);font-size:13px;line-height:1.55;color:var(--green-text)}
  .a[hidden]{display:none}

  .footer{display:flex;gap:8px;margin-top:18px}
  .ghost{flex:1;text-align:center;font:700 13px/1 inherit;padding:13px;border-radius:11px;border:1px solid var(--border2);
         background:transparent;color:var(--text2);cursor:pointer}
  .solid{flex:1.3;text-align:center;font:800 13px/1 inherit;padding:13px;border-radius:11px;background:var(--green);
         color:#04150F;border:none;cursor:pointer}
  .note{font-size:11px;line-height:1.45;color:var(--text3);text-align:center;margin-top:10px}

  /* avaliação */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
  .opts{display:flex;gap:6px;flex-wrap:wrap}
  .opt-row{flex:1;min-width:88px;padding:10px 8px;border-radius:10px;border:1px solid var(--border2);background:var(--bg2);
           color:var(--text2);font:700 12px/1.2 inherit;cursor:pointer;text-align:center}
  .opt-row[aria-pressed="true"]{background:var(--green-bg);border-color:var(--green-line);color:var(--green-text)}
  textarea{width:100%;min-height:78px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;
           color:var(--text);font:inherit;font-size:13px;padding:10px;resize:vertical}
  .out{margin-top:14px;background:#0B0F18;border:1px solid var(--border);border-radius:11px;padding:12px;
       font-family:var(--mono);font-size:12px;line-height:1.6;color:#9FE8C4;white-space:pre-wrap}
  .done{font-size:13px;color:var(--text2);line-height:1.6}
  .done b{color:var(--green-text)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="back" id="backBtn" aria-label="Voltar" hidden>←</button>
    <h1 id="title">📚 Biblioteca</h1>
    <span class="prog" id="prog"></span>
  </div>
  <div id="view"></div>
</div>

<script>
'use strict';

/* ────────────────────────────────────────────────────────────────────────────
   Protótipo de avaliação. Nada aqui é conteúdo copiado do curso: os cartões
   foram escritos a partir do currículo CCNA e das 320 questões do simulador.
   Estado em memória + localStorage (só para lembrar o que o colega já leu).
   ──────────────────────────────────────────────────────────────────────────── */

const CARDS = [
  {
    id: 'vlans-trunk', topico: 'VLANs', cor: '#1D9E75', min: 2,
    titulo: 'Trunk: levar várias VLANs por um cabo',
    gancho: 'Sem trunk, cada VLAN precisaria de um cabo até o roteador — um prédio com 12 setores viraria 12 cabos.',
    ideia: 'Um link trunk carrega quadros de várias VLANs ao mesmo tempo e marca cada um com a VLAN de origem. A marcação é o <b>tag 802.1Q</b>, inserido dentro do quadro. Porta de acesso não marca nada: ela já pertence a uma VLAN só. Quem decide se a porta é acesso ou trunk é a configuração, não o cabo.',
    analogia: 'Porta de acesso é carta entregue na mão, um destino só. Trunk é o caminhão da transportadora: várias caixas de destinos diferentes no mesmo veículo, cada uma com etiqueta.',
    prova: [
      '<b>Native VLAN viaja sem tag.</b> Se os dois lados discordam dela, o tráfego cai na VLAN errada e aparece <i>native VLAN mismatch</i> — pegadinha clássica.',
      'Trunk não cria VLAN: a VLAN precisa existir nos dois switches.',
      'Por padrão o trunk permite todas as VLANs; restringir é <b>allowed vlan</b>.'
    ],
    cmd: '<span class="cm">interface Gi0/1</span>\n switchport mode trunk\n switchport trunk native vlan 99\n switchport trunk allowed vlan 10,20,99',
    quiz: [
      { q: 'Por que a native VLAN viaja sem tag — e o que quebra se os dois lados discordarem?',
        a: 'Ela é a VLAN "de casa" do link: o padrão histórico é não marcar. Se os números divergem, o quadro sem tag é lido como outra VLAN — o tráfego vaza para o lugar errado e o switch avisa <i>native VLAN mismatch</i>.' },
      { q: 'O que muda no quadro ao atravessar um trunk, e onde exatamente esse campo entra?',
        a: 'O quadro ganha o tag de 4 bytes do 802.1Q, inserido logo depois do MAC de origem: o campo EtherType passa a 0x8100 e o EtherType original vem depois do tag. O quadro cresce de 1518 para 1522 bytes e o FCS é recalculado.' },
      { q: 'O trunk está de pé, mas a VLAN 30 não passa. Duas causas possíveis?',
        a: '1) a VLAN 30 não existe no switch (banco de VLANs / VTP); 2) a lista permitida do trunk não inclui a 30 — ou inclui em um lado só. Vale conferir também poda (pruning) e se a porta do outro lado está em access.' }
    ]
  },
  {
    id: 'ospf-adjacencia', topico: 'OSPF', cor: '#2555B6', min: 3,
    titulo: 'Por que dois roteadores não viram vizinhos',
    gancho: 'A maioria dos problemas de OSPF não é rota errada — é vizinhança que nunca subiu.',
    ideia: 'Dois roteadores só formam adjacência se concordarem em quase tudo: mesma <b>área</b>, mesma <b>sub-rede e máscara</b>, mesmos <b>timers</b> (hello 10 s / dead 40 s em Ethernet), mesma <b>autenticação</b> e mesma <b>MTU</b>. Divergiu um item, a sessão fica presa — e o estado travado entrega o motivo. Em rede broadcast ainda existem <b>DR e BDR</b>, eleitos pela maior prioridade e, no empate, pelo maior Router ID. Não há reeleição: um DR novo só aparece se o atual cair.',
    analogia: 'É uma reunião que só começa com todo mundo de acordo sobre horário, idioma e pauta. Se um chega falando outra língua, a reunião não começa — e ninguém entra na sala.',
    prova: [
      'Dois roteadores que não são DR nem BDR ficam em <b>2WAY</b> — e isso é normal, não é falha.',
      'Preso em <b>EXSTART/EXCHANGE</b>? Quase sempre <b>MTU diferente</b> entre as interfaces.',
      'Hello de um lado 10 s e do outro 30 s: nunca sai do INIT/DOWN.'
    ],
    cmd: '<span class="cm">show ip ospf neighbor</span>\n<span class="cm">show ip ospf interface Gi0/1</span>\nRouter ID: 2.2.2.2   Area 0\nHello 10, Dead 40, MTU 1500',
    quiz: [
      { q: 'Liste quatro coisas que precisam bater para a adjacência subir.',
        a: 'Área, sub-rede/máscara da interface, timers (hello/dead) e autenticação. A quinta, que muita gente esquece: MTU — diferente, a sessão para em EXSTART.' },
      { q: 'A sessão está em EXSTART há minutos. Qual é a primeira suspeita?',
        a: 'MTU diferente entre as duas interfaces. O roteador com MTU menor descarta o DBD maior e a troca nunca avança — confirme com "show ip ospf interface" e "show interface".' },
      { q: 'Por que dois roteadores que não são DR nem BDR não passam de 2WAY?',
        a: 'Em rede broadcast só DR e BDR formam adjacência plena com todo mundo. Dois DROTHERs só trocam hellos: é o estado 2WAY, que significa "nos vimos", não "somos vizinhos".' }
    ]
  },
  {
    id: 'auto-api-json', topico: 'Automação', cor: '#6E4DD3', min: 3,
    titulo: 'O que JSON e API têm a ver com cabo e switch',
    gancho: 'Configurar 50 switches à mão é 50 chances de errar a mesma linha — automação existe para isso.',
    ideia: 'Em vez de digitar comando em cada equipamento, um <b>controlador</b> conversa com todos eles. A conversa tem duas direções: <b>northbound</b> é a API que o seu programa usa para pedir ("aplicar esta política"), <b>southbound</b> é como o controlador fala com o equipamento (CLI, SNMP, NETCONF). Os dados viajam em <b>JSON</b> (chaves aninhadas) ou <b>YAML</b> (indentação, mais legível). API <b>REST</b> usa os verbos HTTP: GET lê, POST cria, PUT/PATCH atualiza, DELETE remove.',
    analogia: 'O controlador é o gerente que recebe o pedido em português (northbound) e distribui a tarefa para cada funcionário no idioma que ele entende (southbound). Você fala uma vez; ele repete 50 vezes sem errar.',
    prova: [
      '<b>Northbound = aplicações; southbound = dispositivos.</b> Trocar os dois é o erro mais comum.',
      '<b>Ansible é sem agente</b> (SSH + playbook YAML); <b>Puppet e Chef usam agente</b>.',
      'JSON exige chaves e aspas; YAML vive de <b>indentação</b> — um espaço errado quebra o arquivo.'
    ],
    cmd: '{\n  "interface": "Gi0/1",\n  "description": "UPLINK",\n  "enabled": true\n}\n\ninterface: Gi0/1\ndescription: UPLINK\nenabled: true',
    quiz: [
      { q: 'Qual API o seu script chama, e qual o controlador usa para falar com o switch?',
        a: 'O script chama a API northbound (REST, normalmente JSON). O controlador fala com o equipamento pela southbound (NETCONF, SNMP ou CLI).' },
      { q: 'Qual verbo HTTP você usaria para corrigir um campo já existente?',
        a: 'PATCH, quando quer mudar só aquele campo. PUT troca o recurso inteiro — funciona, mas exige mandar tudo de novo. GET lê, POST cria, DELETE remove.' },
      { q: 'Por que "Ansible precisa instalar agente no switch" é falso?',
        a: 'Ansible é agente-less: conecta por SSH (ou WinRM) e executa módulos temporários. Puppet e Chef é que rodam agente no equipamento.' }
    ]
  }
];

const KEY_READ = 'bib_demo_lidos';
const KEY_AVAL = 'bib_demo_avaliacao';

const lidos = () => { try { return JSON.parse(localStorage.getItem(KEY_READ) || '[]'); } catch { return []; } };
const marcarLido = id => { const s = new Set(lidos()); s.add(id); localStorage.setItem(KEY_READ, JSON.stringify([...s])); };

let screen = 'lib';   // lib | card | aval
let atual = 0;

const $ = sel => document.querySelector(sel);
const view = $('#view'), title = $('#title'), prog = $('#prog'), back = $('#backBtn');

/* ── TELA: BIBLIOTECA ─────────────────────────────────────────────────────── */
function renderLib() {
  screen = 'lib';
  title.textContent = '📚 Biblioteca';
  prog.textContent = '';
  back.hidden = true;

  const l = lidos();
  const pct = Math.round(l.length / CARDS.length * 100);

  view.innerHTML = `
    <p class="lead">Protótipo para avaliação: <b>3 cartões</b> escritos a partir do currículo CCNA.
       Leia como aluno — do gancho até as perguntas de recuperação — e responda a avaliação no fim.</p>

    <div class="reco">
      <div class="kicker">◆ Seu estudo de hoje</div>
      <h2>${CARDS[1].titulo}</h2>
      <p>Você errou <b>4 de 7</b> questões de OSPF nesta semana. Três cartões resolvem o conceito antes da próxima prova.</p>
      <div class="row">
        <span class="pill">${CARDS[1].min} min · nível 2</span>
        <button class="cta" id="estudar">Estudar agora →</button>
      </div>
    </div>

    <div class="sec">Cartões deste protótipo</div>
    <div class="list" id="lista">
      ${CARDS.map((c, i) => `
        <button class="tcard" data-i="${i}">
          <span class="bar" style="background:${c.cor}"></span>
          <span class="info">
            <span class="nm">${c.topico}</span>
            <span class="meta">${c.titulo}</span>
          </span>
          <span class="ring" style="background:${l.includes(c.id) ? 'var(--green-bg)' : 'var(--bg3)'};
                color:${l.includes(c.id) ? 'var(--green-text)' : 'var(--text3)'};
                border:2px solid ${l.includes(c.id) ? 'var(--green-line)' : 'var(--border2)'}">
            ${l.includes(c.id) ? '✓' : (i + 1)}
          </span>
        </button>`).join('')}
    </div>

    <div class="sec">Avaliação</div>
    <div class="list">
      <button class="tcard" id="irAval">
        <span class="bar" style="background:var(--green)"></span>
        <span class="info"><span class="nm">Responder (3 perguntas)</span>
        <span class="meta">${l.length} de ${CARDS.length} cartões lidos · ${pct}%</span></span>
        <span class="ring" style="background:var(--bg3);color:var(--text3);border:2px solid var(--border2)">→</span>
      </button>
    </div>
    <p class="note">Protótipo — o conteúdo dos cartões não substitui o curso, e ler aqui não dá XP.</p>`;

  view.querySelectorAll('.tcard[data-i]').forEach(b =>
    b.addEventListener('click', () => abrirCard(Number(b.dataset.i))));
  $('#estudar').addEventListener('click', () => abrirCard(1));
  $('#irAval').addEventListener('click', renderAval);
}

/* ── TELA: CARTÃO ─────────────────────────────────────────────────────────── */
function abrirCard(i) {
  atual = i;
  renderCard();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function renderCard() {
  screen = 'card';
  const c = CARDS[atual];
  title.textContent = 'Cartão · ' + c.topico;
  prog.textContent = `${atual + 1} de ${CARDS.length}`;
  back.hidden = false;

  view.innerHTML = `
    <span class="tag" style="border-left-color:${c.cor};border-color:${c.cor}66">${c.topico}</span>
    <h2 class="ctitle">${c.titulo}</h2>
    <div class="hook">${c.gancho}</div>

    <div class="blk"><div class="lbl">A ideia central</div><p>${c.ideia}</p></div>
    <div class="blk"><div class="lbl">A analogia</div><p>${c.analogia}</p></div>
    <div class="blk"><div class="lbl">Onde a prova cobra</div>
      <ul class="bullets">${c.prova.map(p => `<li>${p}</li>`).join('')}</ul>
    </div>
    <div class="blk"><div class="lbl">No equipamento / nos dados</div>
      <div class="cmd">${c.cmd}</div>
    </div>

    <div class="sec">Fixou? Responda de cabeça</div>
    ${c.quiz.map((q, k) => `
      <div class="quiz">
        <div class="q"><b>${k + 1}.</b>${q.q}</div>
        <button class="reveal" data-k="${k}" aria-expanded="false" aria-controls="a${k}">ver resposta</button>
        <div class="a" id="a${k}" hidden>${q.a}</div>
      </div>`).join('')}

    <div class="footer">
      <button class="ghost" id="voltar">← Biblioteca</button>
      <button class="solid" id="proximo">${atual + 1 < CARDS.length ? 'Li este cartão ✓ · próximo' : 'Li este cartão ✓ · avaliar'}</button>
    </div>
    <p class="note">Ler não dá XP — leitura não é desempenho. O selo de Biblioteca é separado do ranking.</p>`;

  view.querySelectorAll('.reveal').forEach(b => b.addEventListener('click', () => {
    const alvo = $('#a' + b.dataset.k);
    const aberto = !alvo.hidden;
    alvo.hidden = aberto;
    b.setAttribute('aria-expanded', String(!aberto));
    b.textContent = aberto ? 'ver resposta' : 'esconder resposta';
  }));

  $('#voltar').addEventListener('click', renderLib);
  $('#proximo').addEventListener('click', () => {
    marcarLido(c.id);
    if (atual + 1 < CARDS.length) abrirCard(atual + 1); else renderAval();
  });
}

/* ── TELA: AVALIAÇÃO ──────────────────────────────────────────────────────── */
const PERGUNTAS = [
  { id: 'tempo',    t: 'Deu para ler cada cartão em até 90 segundos?', opts: ['Sim, tranquilo', 'Quase', 'Não, é longo'] },
  { id: 'recall',   t: 'Respondeu as 3 perguntas de recuperação sem voltar ao texto?', opts: ['Sim', 'Em parte', 'Não'] },
  { id: 'tom',      t: 'O texto parece explicação de alguém, ou material de curso?', opts: ['De alguém', 'Meio a meio', 'De curso'] },
  { id: 'util',     t: 'Isso te ajudaria a estudar antes da prova?', opts: ['Muito', 'Um pouco', 'Não'] },
  { id: 'prefere',  t: 'Preferiria isto a reler o material do curso?', opts: ['Sim', 'Tanto faz', 'Não'] }
];

function renderAval() {
  screen = 'aval';
  title.textContent = 'Avaliação';
  prog.textContent = '';
  back.hidden = false;

  const salvo = (() => { try { return JSON.parse(localStorage.getItem(KEY_AVAL) || '{}'); } catch { return {}; } })();

  view.innerHTML = `
    <p class="lead">Cinco perguntas rápidas. No fim, você copia o resumo e manda para o Caique.</p>
    ${PERGUNTAS.map(p => `
      <div class="field" data-id="${p.id}">
        <label>${p.t}</label>
        <div class="opts">
          ${p.opts.map(o => `<button class="opt-row" data-id="${p.id}" data-v="${o}"
            aria-pressed="${salvo[p.id] === o}">${o}</button>`).join('')}
        </div>
      </div>`).join('')}

    <div class="field">
      <label for="obs">Comentário (opcional)</label>
      <textarea id="obs" placeholder="O que ficou confuso? O que faltou?">${salvo.obs || ''}</textarea>
    </div>

    <div class="footer">
      <button class="ghost" id="voltarLib">← Biblioteca</button>
      <button class="solid" id="gerar">Gerar resumo</button>
    </div>
    <div id="saida"></div>`;

  let respostas = {};
  PERGUNTAS.forEach(p => { if (salvo[p.id]) respostas[p.id] = salvo[p.id]; });

  view.querySelectorAll('.opt-row').forEach(b => b.addEventListener('click', () => {
    const grupo = b.closest('.field');
    grupo.querySelectorAll('.opt-row').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    respostas[b.dataset.id] = b.dataset.v;
  }));

  $('#voltarLib').addEventListener('click', renderLib);
  $('#gerar').addEventListener('click', () => {
    const obs = $('#obs').value.trim();
    localStorage.setItem(KEY_AVAL, JSON.stringify({ ...respostas, obs }));

    const faltando = PERGUNTAS.filter(p => !respostas[p.id]);
    if (faltando.length) {
      $('#saida').innerHTML = `<div class="out">Faltam ${faltando.length} pergunta(s) para responder.</div>`;
      return;
    }

    const linhas = PERGUNTAS.map(p => `• ${p.t}\n  → ${respostas[p.id]}`).join('\n');
    const txt = `Avaliação — Biblioteca SubnetLab (protótipo)\n`
      + `Cartões lidos: ${lidos().length}/${CARDS.length}\n\n${linhas}`
      + (obs ? `\n\nComentário: ${obs}` : '');

    $('#saida').innerHTML = `
      <div class="out" id="txtResumo">${txt.replace(/</g, '&lt;')}</div>
      <div class="footer">
        <button class="ghost" id="copiar">Copiar resumo</button>
        <button class="solid" id="zap">Enviar no WhatsApp</button>
      </div>
      <p class="note" id="aviso"></p>`;

    const aviso = $('#aviso');
    $('#copiar').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(txt); aviso.textContent = 'Resumo copiado — cole no chat do Caique.'; }
      catch { aviso.textContent = 'Não deu para copiar automaticamente: selecione o texto acima.'; }
    });
    $('#zap').addEventListener('click', () => {
      window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
    });
  });
}

/* ── navegação ────────────────────────────────────────────────────────────── */
back.addEventListener('click', () => (screen === 'card' ? renderLib() : renderLib()));

/* Hash simples para o colega poder mandar o link direto de um cartão */
function rota() {
  const h = location.hash.replace('#', '');
  const i = CARDS.findIndex(c => c.id === h);
  if (i >= 0) abrirCard(i); else renderLib();
}
window.addEventListener('hashchange', rota);
rota();
</script>
