<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SubnetLab: mix de 2 minutos (protótipo)</title>
<meta name="theme-color" content="#0F1117">
<style>
  :root{
    --bg:#0F1117; --bg2:#12172B; --bg3:#1A1D2F; --border:#232841; --border2:#2E3550;
    --text:#E8EAF6; --text2:#A8AFC7; --text3:#8A93AE;
    --green:#2ECC8F; --green-text:#5EE0A8; --green-bg:#0E2A22; --green-line:#1E5A47;
    --blue-text:#7AB8F5; --blue-bg:#12203A; --blue-line:#24406B;
    --red-text:#F08080; --red-bg:#2A1315; --red-line:#5A2126;
    --yellow:#F5C842; --purple-text:#B79CF5; --radius:13px;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
  .topbar{display:flex;align-items:center;gap:10px;padding:14px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
  .topbar h1{font-size:15px;font-weight:800}
  .back{width:38px;height:38px;border-radius:50%;border:1px solid var(--border2);background:transparent;color:var(--text2);
        display:grid;place-items:center;cursor:pointer;padding:0;line-height:0}
  .back svg{width:15px;height:15px;display:block}
  .back[hidden]{display:none}
  .stat{margin-left:auto;font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
  .lead{font-size:12.5px;color:var(--text3);line-height:1.5;margin:2px 0 14px}
  .lead b{color:var(--text2)}

  .timer{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .tbar{flex:1;height:5px;background:var(--bg3);border-radius:4px;overflow:hidden}
  .tfill{height:100%;background:var(--green);transition:width .9s linear}
  .tnum{font-size:11.5px;color:var(--text2);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
  .dots{display:flex;gap:6px;margin-bottom:16px}
  .dot{width:22px;height:4px;border-radius:3px;background:var(--bg3)}
  .dot.on{background:var(--green)}
  .dot.done{background:var(--green-line)}

  .tag{display:inline-flex;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
       padding:4px 9px;border-radius:20px;background:var(--blue-bg);color:var(--blue-text);border:.5px solid var(--blue-line)}
  .tag.chute{background:#2A2036;color:var(--purple-text);border-color:#4A3A5E}
  .tag.explica{background:#2A2412;color:var(--yellow);border-color:#4A3E12}

  .qtext{font-size:15.5px;line-height:1.5;font-weight:600;margin:10px 0 14px}
  .concept{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;
           font-size:13.5px;line-height:1.55;color:var(--text2);margin-bottom:12px}
  .concept b{color:var(--text)}

  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{width:100%;text-align:left;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;
       padding:12px 13px;color:var(--text);font:600 13.5px/1.4 inherit;cursor:pointer;display:flex;gap:10px}
  .opt .letra{flex:0 0 20px;height:20px;border-radius:50%;background:var(--bg3);color:var(--text3);
              display:grid;place-items:center;font:800 10.5px/1 inherit}
  .opt:hover{border-color:var(--border)}
  .opt.correct{border-color:var(--green-line);background:var(--green-bg);color:var(--green-text)}
  .opt.correct .letra{background:var(--green);color:#04150F}
  .opt.wrong{border-color:var(--red-line);background:var(--red-bg);color:var(--red-text)}
  .opt.wrong .letra{background:var(--red-line);color:#fff}
  .opt.mute{color:var(--text3);border-color:var(--border)}

  .why{margin-top:12px;padding:12px 13px;background:var(--bg2);border:1px solid var(--border);
       border-left:3px solid var(--green-line);border-radius:10px;font-size:13px;line-height:1.55;color:var(--text2)}
  .why[hidden]{display:none}
  .why b{color:var(--text)}

  textarea{width:100%;min-height:84px;background:var(--bg2);border:1px solid var(--border2);border-radius:11px;
           color:var(--text);font:inherit;font-size:13.5px;line-height:1.5;padding:11px;resize:vertical}
  textarea::placeholder{color:var(--text3)}
  .pontos{margin-top:12px;padding:12px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;
          font-size:12.5px;line-height:1.55;color:var(--text2)}
  .pontos[hidden]{display:none}
  .pontos ul{list-style:none;margin-top:6px;display:flex;flex-direction:column;gap:6px}
  .pontos li{padding-left:16px;position:relative}
  .pontos li:before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--green)}

  .btn{font:800 13px/1 inherit;padding:13px;border-radius:11px;border:none;background:var(--green);color:#04150F;
       width:100%;cursor:pointer;margin-top:14px}
  .btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--text2);font-weight:700}
  .btn[hidden]{display:none}

  .end{text-align:center;padding:20px 6px}
  .end .big{font-size:44px;font-weight:800;color:var(--green-text);line-height:1}
  .end .sub{font-size:13.5px;color:var(--text2);margin:8px 0 4px}
  .end .streak{font-size:12.5px;color:var(--yellow);margin-top:6px}
  .rec{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text3);
       border-top:1px solid var(--border);padding-top:11px;margin-top:16px}
  .note{font-size:11px;line-height:1.45;color:var(--text3);margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="back" id="backBtn" aria-label="Sair do mix" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title">Mix de 2 minutos</h1>
    <span class="stat" id="stat"></span>
  </div>
  <div id="view"></div>
</div>

<script>
'use strict';

/* ────────────────────────────────────────────────────────────────────────────
   Protótipo do "mix diário": 1 pré-teste, 3 questões reais e 1 autoexplicação,
   em 2 minutos. Sem XP: é aquecimento + recuperação, não desempenho.
   Perguntas vêm do banco do simulador; os prompts de pré-teste e autoexplicação
   saem dos cartões da Biblioteca.
   ──────────────────────────────────────────────────────────────────────────── */

const QUESTOES = [{"tp": "Roteamento", "t": "Como um roteador tratará o roteamento estático se o Cisco Express Forwarding (CEF) estiver desabilitado?", "o": ["Ele não executará pesquisas recursivas.", "Interfaces ponto-a-ponto seriais exigirão rotas estáticas totalmente especificadas para evitar inconsistências.", "Interfaces multiacesso Ethernet exigirão rotas estáticas totalmente especificadas para evitar inconsistências.", "Rotas estáticas que usam uma interface de saída serão desnecessárias."], "c": 2, "w": "Quando o CEF está desabilitado, o roteador usa process switching. Em interfaces multiacesso (Ethernet), é necessário especificar tanto a interface de saída quanto o próximo salto (rota totalmente especificada), pois sem CEF a resolução ARP pode falhar com apenas o next-hop."}, {"tp": "WLAN", "t": "Que método de autenticação sem fio depende de um servidor de autenticação RADIUS?", "o": ["WEP", "WPA Personal", "WPA2 Personal", "WPA2 Enterprise"], "c": 3, "w": "WPA2 Enterprise usa o protocolo 802.1X com EAP, que requer um servidor RADIUS para autenticar usuários individualmente com credenciais (usuário/senha ou certificados). WPA/WPA2 Personal utilizam apenas uma chave pré-compartilhada (PSK), sem necessidade de servidor RADIUS."}, {"tp": "WLAN", "t": "Qual é o método de criptografia sem fio mais seguro disponível atualmente?", "o": ["WPA", "WEP", "WPA2 com TKIP", "WPA2 com AES"], "c": 3, "w": "WPA2 com AES (Advanced Encryption Standard, 128-bit) é o método mais seguro. WEP é facilmente quebrado. WPA com TKIP é obsoleto. WPA2 com TKIP é mais forte que WEP/WPA, mas ainda inferior ao AES. WPA2-AES é o padrão atual recomendado (base do WPA3)."}, {"tp": "Segurança L2", "t": "Durante o processo AAA, quando a autorização será implementada?", "o": ["Imediatamente após a autenticação bem-sucedida em uma fonte de dados AAA", "Imediatamente após a contabilidade e auditoria da AAA receberem relatórios detalhados", "Imediatamente após um cliente AAA enviar informações de autenticação ao servidor centralizado", "Imediatamente após a determinação de quais recursos um usuário pode acessar"], "c": 0, "w": "No modelo AAA: (A) Autenticação verifica a identidade; (A) Autorização determina o que o usuário autenticado pode fazer, e ocorre imediatamente após a autenticação bem-sucedida; (A) Contabilidade registra o que foi feito. A autorização só acontece após a identidade ser confirmada."}, {"tp": "DHCPv4", "t": "Que ação um cliente DHCPv4 toma se receber mais de um DHCPOFFER de vários servidores DHCP?", "o": ["Descarta ambas as ofertas e envia um novo DHCPDISCOVER.", "Envia um DHCPREQUEST identificando qual oferta de locação está aceitando.", "Envia um DHCPNAK e inicia o processo DHCP novamente.", "Aceita ambas as mensagens DHCPOFFER e envia um DHCPACK."], "c": 1, "w": "O cliente aceita normalmente a primeira oferta recebida e responde com um DHCPREQUEST broadcast, que inclui o Server Identifier do servidor escolhido. Os demais servidores veem esse broadcast e retornam suas ofertas ao pool. O servidor escolhido responde com DHCPACK para concluir a negociação."}, {"tp": "Segurança L2", "t": "Um administrador encontrou um usuário enviando um quadro 802.1Q com duas tags (double tagging) para um switch. Qual é a melhor solução para prevenir esse tipo de ataque (VLAN hopping)?", "o": ["As VLANs das portas de acesso de usuário devem ser diferentes das VLANs nativas usadas nas portas de tronco.", "As portas de tronco devem usar a VLAN padrão (VLAN 1) como VLAN nativa.", "As portas de tronco devem ser configuradas com port security.", "A VLAN nativa usada em qualquer tronco deve ser uma das VLANs de dados ativas."], "c": 0, "w": "O ataque de double tagging explora o fato de que a tag da VLAN nativa é removida pelo switch. Se um atacante na VLAN 10 enviar um frame com duas tags (VLAN 10 externa, VLAN 20 interna), o switch remove a tag 10 (nativa) e encaminha na VLAN 20. A mitigação é garantir que as portas de acesso de usuário estejam em VLANs diferentes da VLAN nativa dos troncos."}, {"tp": "Switching", "t": "Qual instrução está correta sobre como um switch de Camada 2 determina como encaminhar quadros?", "o": ["Quadros unicast são sempre encaminhados, independentemente do endereço MAC destino.", "Apenas quadros com endereço de broadcast são encaminhados por todas as portas ativas.", "O encaminhamento cut-through garante que quadros inválidos sejam descartados.", "Decisões de encaminhamento são baseadas em endereços MAC e mapeamentos de porta na tabela CAM."], "c": 3, "w": "O switch usa a tabela CAM (Content Addressable Memory), também chamada de tabela MAC, que mapeia endereços MAC às portas. Quando um frame chega, o switch consulta a tabela para determinar a porta de saída. Se o MAC destino não estiver na tabela, o switch realiza flooding."}, {"tp": "Roteamento", "t": "Qual prefixo IPv6 foi projetado para comunicação link-local?", "o": ["fe80::/10", "fc::/07", "2001::/3", "ff00::/8"], "c": 0, "w": "Endereços com prefixo fe80::/10 são link-local: válidos apenas no segmento local e não roteáveis. Servem para comunicação entre vizinhos (NDP, protocolos de roteamento) e são configurados automaticamente em toda interface IPv6 habilitada. ff00::/8 é multicast; 2001::/3 é unicast global; fc::/7 é unicast local único (ULA)."}, {"tp": "Roteamento", "t": "Depois que um host gera um endereço IPv6 por DHCPv6 ou SLAAC, como ele verifica se o endereço é único e utilizável?", "o": ["O host envia uma mensagem de echo request ICMPv6 ao endereço aprendido e, se não houver resposta, considera-o único.", "O host envia uma mensagem Neighbor Solicitation ICMPv6 ao endereço aprendido e, se não receber Neighbor Advertisement, considera-o único.", "O host verifica no cache de vizinhos local e, se o endereço não estiver armazenado, considera-o único.", "O host envia um broadcast ARP no link local e, se não houver resposta, considera o endereço único."], "c": 1, "w": "O processo DAD (Duplicate Address Detection) usa mensagens ICMPv6 Neighbor Solicitation (NS) enviadas ao endereço multicast solicited-node do novo endereço. Se nenhuma mensagem Neighbor Advertisement (NA) for recebida, o endereço é considerado único e é atribuído à interface. ARP é IPv4; IPv6 usa NDP."}, {"tp": "Segurança L2", "t": "Qual ataque de rede busca criar um DoS para clientes, impedindo-os de obter um endereço DHCP?", "o": ["Privação de DHCP (DHCP starvation)", "DHCP Spoofing", "Spoofing de endereço IP", "Ataque de tabela CAM"], "c": 0, "w": "O ataque de DHCP starvation usa ferramentas como Gobbler para enviar centenas de DHCPDISCOVER com MACs falsificados aleatórios, esgotando o pool de endereços do servidor. Clientes legítimos não conseguem obter IP (DoS). DHCP Spoofing implanta um servidor DHCP falso para redirecionar tráfego."}];

const CHUTES = [
  { pergunta: 'A native VLAN leva tag 802.1Q quando atravessa o trunk?',
    opcoes: ['Leva tag', 'Não leva tag', 'Depende do switch'],
    correta: 1,
    explica: 'A native VLAN é justamente a que viaja <b>sem</b> tag. Se os dois lados discordarem do número dela, o quadro sem marcação é lido como outra VLAN e o switch avisa <i>native VLAN mismatch</i>.' },
  { pergunta: 'Dois roteadores OSPF que não são DR nem BDR podem chegar ao estado FULL?',
    opcoes: ['Sim, sempre', 'Não: eles ficam em 2WAY', 'Só se forem vizinhos diretos'],
    correta: 1,
    explica: 'Em rede broadcast só DR e BDR formam adjacência plena com todos. Dois DROTHERs param em <b>2WAY</b>, e isso é normal: significa que se viram, não que são vizinhos.' }
];

const EXPLICACOES = [
  { titulo: 'Trunk e native VLAN',
    conceito: 'Um trunk carrega várias VLANs no mesmo link e marca cada quadro com o tag 802.1Q. A exceção é a <b>native VLAN</b>, que viaja sem marcação.',
    pedido: 'Explique em uma frase por que a native VLAN precisa ser igual nos dois lados do trunk.',
    pontos: ['ela viaja sem tag', 'o quadro sem marcação é interpretado pela native VLAN do outro lado',
             'números diferentes fazem o tráfego cair na VLAN errada, com aviso de native VLAN mismatch'] },
  { titulo: 'Adjacência OSPF travada',
    conceito: 'Dois roteadores só saem do estado inicial se concordarem em área, sub-rede, timers, autenticação e MTU.',
    pedido: 'Explique por que uma sessão presa em EXSTART/EXCHANGE aponta para MTU diferente.',
    pontos: ['é na troca de DBD que cada um compara o próprio banco com o do vizinho',
             'quem tem MTU menor descarta o pacote maior',
             'sem essa troca, a sessão nunca avança para FULL'] }
];

const KEY = 'bib_mix';
const ler = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
const salvar = (k, v) => localStorage.setItem(KEY, JSON.stringify({ ...ler(), [k]: v }));
const hoje = () => new Date().toISOString().slice(0, 10);

const shuffle = a => { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [x[i], x[j]] = [x[j], x[i]]; } return x; };
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const $ = s => document.querySelector(s);
const view = $('#view'), titulo = $('#title'), statEl = $('#stat'), back = $('#backBtn');

let sessao = null;

/* ── monta a sessão ─────────────────────────────────────────────────────── */
function montar() {
  const q = shuffle(QUESTOES).slice(0, 3);
  const chute = CHUTES[Math.random() * CHUTES.length | 0];
  const expl = EXPLICACOES[Math.random() * EXPLICACOES.length | 0];
  sessao = {
    itens: [{ tipo: 'chute', dado: chute }, ...q.map(x => ({ tipo: 'q', dado: x })), { tipo: 'explica', dado: expl }],
    i: 0, acertos: 0, respondidas: 0, restante: 120, timer: null, t0: Date.now(),
    chuteCerto: null, escreveu: false
  };
  iniciar();
}

function iniciar() {
  screen = 'sessao';
  titulo.textContent = 'Mix de 2 minutos';
  statEl.textContent = '';
  back.hidden = false;
  sessao.timer = setInterval(() => {
    sessao.restante--;
    const f = $('#tfill'); if (f) f.style.width = (sessao.restante / 120 * 100) + '%';
    const n = $('#tnum'); if (n) n.textContent = fmt(Math.max(0, sessao.restante));
    if (sessao.restante <= 0) fim();
  }, 1000);
  pintar();
}

function pintar() {
  const { tipo, dado } = sessao.itens[sessao.i];
  const dots = sessao.itens.map((_, k) =>
    `<span class="dot ${k < sessao.i ? 'done' : k === sessao.i ? 'on' : ''}"></span>`).join('');

  const barra = `
    <div class="timer">
      <div class="tbar"><div class="tfill" id="tfill" style="width:${sessao.restante / 120 * 100}%"></div></div>
      <span class="tnum" id="tnum">${fmt(Math.max(0, sessao.restante))}</span>
    </div>
    <div class="dots">${dots}</div>`;

  if (tipo === 'chute') {
    view.innerHTML = `${barra}
      <span class="tag chute">pré-teste · chute antes de saber</span>
      <div class="qtext">${dado.pergunta}</div>
      <div class="opts" id="opts">
        ${dado.opcoes.map((o, i) => `<button class="opt" data-i="${i}">
          <span class="letra">${'ABC'[i]}</span><span>${o}</span></button>`).join('')}
      </div>
      <div class="why" id="why" hidden></div>
      <button class="btn" id="prox" hidden>Continuar</button>`;

    $('#opts').querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      const i = Number(b.dataset.i);
      const certo = i === dado.correta;
      sessao.chuteCerto = certo;
      $('#opts').querySelectorAll('.opt').forEach((x, k) => {
        x.disabled = true;
        if (k === dado.correta) x.classList.add('correct');
        else if (k === i) x.classList.add('wrong');
        else x.classList.add('mute');
      });
      const w = $('#why');
      w.hidden = false;
      w.innerHTML = `${certo ? '<b>Acertou o chute.</b> ' : '<b>Chutou errado.</b> '}${dado.explica}`;
      $('#prox').hidden = false;
      $('#prox').focus();
    }));
  }

  if (tipo === 'q') {
    view.innerHTML = `${barra}
      <span class="tag">questão ${sessao.respondidas + 1} de 3 · ${dado.tp}</span>
      <div class="qtext">${dado.t}</div>
      <div class="opts" id="opts">
        ${dado.o.map((o, i) => `<button class="opt" data-i="${i}">
          <span class="letra">${'ABCDF'[i] || i + 1}</span><span>${o}</span></button>`).join('')}
      </div>
      <div class="why" id="why" hidden></div>
      <button class="btn" id="prox" hidden>${sessao.i === sessao.itens.length - 2 ? 'Ir para a explicação' : 'Próxima questão'}</button>`;

    $('#opts').querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      const i = Number(b.dataset.i);
      const certo = i === dado.c;
      sessao.respondidas++;
      if (certo) sessao.acertos++;
      $('#opts').querySelectorAll('.opt').forEach((x, k) => {
        x.disabled = true;
        if (k === dado.c) x.classList.add('correct');
        else if (k === i) x.classList.add('wrong');
        else x.classList.add('mute');
      });
      const w = $('#why');
      w.hidden = false;
      w.innerHTML = `<b>${certo ? 'Certo' : 'Errado'}.</b> ${dado.w}`;
      $('#prox').hidden = false;
      $('#prox').focus();
    }));
  }

  if (tipo === 'explica') {
    view.innerHTML = `${barra}
      <span class="tag explica">autoexplicação · escreva antes de ver</span>
      <div class="qtext">${dado.titulo}</div>
      <div class="concept">${dado.conceito}</div>
      <div class="qtext" style="font-size:14px;font-weight:600">${dado.pedido}</div>
      <textarea id="resp" placeholder="Uma frase basta. Escrever é o que fixa."></textarea>
      <div class="pontos" id="pontos" hidden>
        <b>O que uma boa resposta precisa ter:</b>
        <ul>${dado.pontos.map(p => `<li>${p}</li>`).join('')}</ul>
      </div>
      <button class="btn" id="ver">Ver o que era esperado</button>
      <button class="btn" id="prox" hidden>Concluir o mix</button>`;

    $('#ver').addEventListener('click', () => {
      sessao.escreveu = $('#resp').value.trim().length > 8;
      $('#pontos').hidden = false;
      $('#ver').hidden = true;
      $('#prox').hidden = false;
      $('#prox').focus();
    });
  }

  $('#prox')?.addEventListener('click', () => {
    sessao.i++;
    if (sessao.i >= sessao.itens.length) return fim();
    pintar();
    window.scrollTo({ top: 0, behavior: 'instant' });
  });
}

/* ── fim ────────────────────────────────────────────────────────────────── */
function fim() {
  clearInterval(sessao.timer);
  const segs = Math.min(120, Math.round((Date.now() - sessao.t0) / 1000));
  const s = ler();
  const dia = hoje();
  let streak = s.streak || 0;
  if (s.ultimoDia !== dia) {
    const ontem = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    streak = s.ultimoDia === ontem ? streak + 1 : 1;
    salvar('streak', streak); salvar('ultimoDia', dia);
  }
  if (!s.melhor || sessao.acertos > s.melhor) salvar('melhor', sessao.acertos);

  view.innerHTML = `
    <div class="end">
      <div class="big">${sessao.acertos}/3</div>
      <div class="sub">${sessao.acertos === 3 ? 'Três de três, no tempo.' : 'Anote o que escapou: é isso que o mix de amanhã vai puxar de novo.'}</div>
      <div class="streak">🔥 ${streak} dia${streak > 1 ? 's' : ''} seguido${streak > 1 ? 's' : ''} de mix</div>
      <div class="rec">
        <span>pré-teste: ${sessao.chuteCerto === null ? 'não fez' : sessao.chuteCerto ? 'acertou' : 'errou'}</span>
        <span>autoexplicação: ${sessao.escreveu ? 'escrita' : 'pulada'}</span>
        <span>tempo: ${fmt(segs)}</span>
      </div>
      <button class="btn" id="deNovo">Outro mix</button>
      <button class="btn ghost" id="sair">Voltar</button>
      <div class="note">O mix não dá XP. Ele serve para manter o conteúdo vivo entre as provas.</div>
    </div>`;
  statEl.textContent = '';

  // os botões do fim precisam de handler: sem isso "Outro mix" não faz nada
  $('#deNovo').addEventListener('click', montar);
  $('#sair').addEventListener('click', sair);
}

/* ── navegação ──────────────────────────────────────────────────────────── */
back.addEventListener('click', () => { if (sessao) clearInterval(sessao.timer); sair(); });

function sair() {
  titulo.textContent = 'Mix de 2 minutos';
  statEl.textContent = '';
  back.hidden = true;
  const s = ler();
  view.innerHTML = `
    <p class="lead">Cinco itens, dois minutos: <b>1 pré-teste</b>, <b>3 questões</b> e <b>1 autoexplicação</b>.
       Sem XP e sem ranking. É o aquecimento diário que mantém o conteúdo vivo entre as provas.</p>

    <div class="concept" style="margin-bottom:14px">
      <b>Por que nessa ordem?</b> Chutar antes de saber melhora a retenção do que vem depois.
      Responder de memória fixa mais que reler. Escrever com as próprias palavras revela o buraco que você não sabia que tinha.
    </div>

    <div class="rec" style="border-top:none;margin-top:0;padding-top:0">
      <span>${s.ultimoDia === hoje() ? 'mix de hoje: feito' : 'mix de hoje: pendente'}</span>
      <span>🔥 ${s.streak || 0} dia(s)</span>
      <span>melhor: ${s.melhor !== undefined ? s.melhor + '/3' : 'nenhum'}</span>
    </div>

    <button class="btn" id="comecar">Começar o mix de 2 minutos</button>
    <p class="note">Protótipo para avaliação. As questões são do banco do simulador.</p>`;

  $('#comecar').addEventListener('click', montar);
}

sair();
</script>
</body>
</html>
